<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extra Life 2026 - Stream Control</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { background: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
    #status { width: 100%; font-size: 18px; font-weight: bold; color: #FF5555; padding: 5px; border-bottom: 2px solid #333; margin-bottom: 5px; }
    .connected { color: #55FF55 !important; }
    .panel { background: #222; border: 1px solid #444; border-radius: 6px; padding: 12px; flex: 1 1 300px; box-sizing: border-box; }
    h2 { font-size: 14px; margin: 0 0 10px 0; color: #55FF55; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
    input, select, button { background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    input[type="text"], input[type="datetime-local"], select { width: 100%; margin-bottom: 8px; }
    button { cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 6px; transition: 0.2s; text-transform: uppercase; }
    button:hover { background: #55FF55; color: #000; border-color: #55FF55; }
    .btn-red { border-color: #FF5555; color: #FF5555; }
    .btn-red:hover { background: #FF5555; color: #fff; }
    .btn-gold { border-color: #D4AF37; color: #D4AF37; }
    .btn-gold:hover { background: #D4AF37; color: #000; }
    .btn-group { display: flex; gap: 5px; margin-bottom: 6px; }
    .btn-group button { margin-bottom: 0; }
  </style>
</head>
<body>

  <div id="status">MQTT Status: Connecting...</div>

  <!-- Settings & Visibility -->
  <div class="panel">
    <h2>Global Settings & Timers</h2>
    <div class="row">Global Sound <input type="checkbox" id="enable-sound" checked onchange="sendConfig()"></div>
    <div class="row">Top Clock <input type="checkbox" id="show-clock" checked onchange="sendConfig()"></div>
    <div class="row">Bottom Ticker <input type="checkbox" id="show-ticker" checked onchange="sendConfig()"></div>
    <label style="font-size: 11px; color: #aaa;">Marathon End Time:</label>
    <input type="datetime-local" id="marathon-end" onchange="updateTimer()">
    <button class="btn-gold" onclick="sendConfig()">Force Global Resync</button>
  </div>

  <!-- Layers & Inputs -->
  <div class="panel">
    <h2>Widget Overlays</h2>
    <div class="row">Band Effects Layer <input type="checkbox" id="show-band" checked onchange="sendConfig()"></div>
    <input type="text" id="band-url" value="./band-effects.html" placeholder="Band Effects URL" onchange="sendConfig()">
    <div class="row">Dice of Doom Layer <input type="checkbox" id="show-dice" checked onchange="sendConfig()"></div>
    <input type="text" id="dice-url" value="./dice.html?transparent=1" placeholder="Dice of Doom URL" onchange="sendConfig()">
  </div>

  <!-- Music & Ticker -->
  <div class="panel">
    <h2>Music & Custom Ticker</h2>
    <select id="playlist-dropdown" onchange="populateMusicFields()">
        <option value="">-- Load from playlist.json --</option>
    </select>
    <input type="text" id="np-title" placeholder="Track Title">
    <input type="text" id="np-artist" placeholder="Artist Name">
    <button class="btn-gold" onclick="sendNowPlaying()">Push Now Playing Graphic</button>
    <hr style="border: 1px solid #333; margin: 10px 0;">
    <input type="text" id="ticker-msg" placeholder="Custom Ticker Message">
    <div class="row" style="justify-content: flex-start; gap: 10px;">
      <label>Loops:</label><input type="number" id="ticker-loops" value="3" min="1" max="20" style="width: 60px; margin-bottom: 0;">
    </div>
    <button onclick="sendTickerMessage()">Push Message to Ticker</button>
  </div>

  <!-- Interactive Controls -->
  <div class="panel">
    <h2>Live Triggers & Testing</h2>
    <div class="btn-group">
      <button class="btn-red" onclick="controlDice('ROLL_DICE')">🎲 Roll Dice</button>
      <button onclick="controlDice('RESET_DICE')">Reset Dice</button>
    </div>
    <button class="btn-red" onclick="fireConfetti()">🎉 Fire Confetti Cannon 🎉</button>
    <hr style="border: 1px solid #333; margin: 10px 0;">
    <input type="text" id="test-alert-name" placeholder="Custom Test Donor Name" value="Test Hero">
    <div class="btn-group">
      <button onclick="sendTestAlert(5)">Test $5</button>
      <button onclick="sendTestAlert(25)">Test $25</button>
      <button class="btn-gold" onclick="sendTestAlert(50)">Test $50</button>
    </div>
  </div>

  <script>
    const teamID = "74089";
    const topic = `extralife2026/${teamID}/commands`;
    
    // Fallback JSON in case browser blocks local file fetching
    const fallbackPlaylist = [
      { "title": "A Sorcerers Last Hope", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },  
      { "title": "Amethyst Rain", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Calming Moon", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Crystal Tombs", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Dark Energy", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Destiny", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Dimensions", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" }, 
      { "title": "Dungeon Keeper", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" }, 
      { "title": "Electro Playhouse", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Elixir", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Galactic Exploration", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Genesis", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Infinite Flow", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Jukebox Theory", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Lunar Rover", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Maze", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Meteor Shower Parade", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Midnight Sun", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Moon Base", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Moon Gaze", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Nightfall", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Pursuit", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Pyramid", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Reboot", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Rings of Saturn", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Sapphire Lotus", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Shrine", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Sugar Journey", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Surfing Serenity", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" },
      { "title": "Time Warp", "artist": "Norse Foundry", "art": "images/NorseFoundryVerticalLogo.png" }
    ];
    let loadedPlaylist = [];

    const mqttOptions = { clientId: 'dash_' + Math.random().toString(16).substring(2, 10), keepalive: 60, reconnectPeriod: 1000, clean: true };
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', mqttOptions);
    
    window.addEventListener('DOMContentLoaded', () => {
      initTimer();
      loadPlaylist();
    });

    client.on('connect', () => {
      document.getElementById('status').innerText = "MQTT Status: Connected & Live";
      document.getElementById('status').classList.add('connected');
      client.subscribe(topic);
      sendConfig();
    });

    client.on('message', (t, msg) => {
      try { if(JSON.parse(msg.toString()).type === 'request_sync') sendConfig(); } catch(e){}
    });

    function initTimer() {
      const savedTime = localStorage.getItem('extralife_marathon_end');
      if (savedTime) { document.getElementById('marathon-end').value = savedTime; } 
      else {
        const now = new Date(); now.setHours(now.getHours() + 24);
        document.getElementById('marathon-end').value = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      }
    }

    function updateTimer() {
      localStorage.setItem('extralife_marathon_end', document.getElementById('marathon-end').value);
      sendConfig();
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('./playlist.json');
        if (!res.ok) throw new Error("File not found");
        loadedPlaylist = await res.json();
      } catch(err) {
        console.warn("Local fetch blocked, using embedded fallback playlist.");
        loadedPlaylist = fallbackPlaylist;
      }
      
      const dropdown = document.getElementById('playlist-dropdown');
      loadedPlaylist.forEach((track, index) => {
        const opt = document.createElement('option');
        opt.value = index; opt.innerText = `${track.title} - ${track.artist}`;
        dropdown.appendChild(opt);
      });
    }

    function populateMusicFields() {
      const idx = document.getElementById('playlist-dropdown').value;
      if(idx !== "" && loadedPlaylist[idx]) {
        document.getElementById('np-title').value = loadedPlaylist[idx].title;
        document.getElementById('np-artist').value = loadedPlaylist[idx].artist;
      }
    }

    function sendConfig() {
      if(!client.connected) return;
      const endTimeValue = document.getElementById('marathon-end').value;
      const targetTimeMs = endTimeValue ? new Date(endTimeValue).getTime() : (new Date().getTime() + 86400000);
      
      const payload = {
        type: 'config', 
        payload: {
          clock: { show: document.getElementById('show-clock').checked, pos: 'top-right', scale: 1 },
          ticker: { show: document.getElementById('show-ticker').checked, showProgressBar: true },
          alerts: { pos: 'center' },
          targetTime: targetTimeMs,
          effects: { sound: document.getElementById('enable-sound').checked, visual: true },
          bandEffects: { show: document.getElementById('show-band').checked, url: document.getElementById('band-url').value, pos: 'center', width: 1920, height: 1080 },
          diceOfDoom: { show: document.getElementById('show-dice').checked, url: document.getElementById('dice-url').value, pos: 'center', width: 1920, height: 1080 }
        }
      };
      client.publish(topic, JSON.stringify(payload));
    }

    function sendTickerMessage() {
      if(!client.connected) return;
      const text = document.getElementById('ticker-msg').value;
      if (text.trim() === "") return;
      client.publish(topic, JSON.stringify({ type: 'stage_ticker', payload: { text: text, loops: parseInt(document.getElementById('ticker-loops').value) || 3 } }));
      document.getElementById('ticker-msg').value = "";
    }

    function sendNowPlaying() {
      if(!client.connected) return;
      client.publish(topic, JSON.stringify({ 
        type: 'now_playing', 
        payload: { title: document.getElementById('np-title').value || "Track", artist: document.getElementById('np-artist').value || "Artist", pos: 'top-left' } 
      }));
    }

    function fireConfetti() { if(client.connected) client.publish(topic, JSON.stringify({ type: 'confetti' })); }

    function sendTestAlert(amount) {
      if(!client.connected) return;
      const customName = document.getElementById('test-alert-name').value || "Test Hero";
      client.publish(topic, JSON.stringify({ type: 'alert', payload: { id: 'TEST_' + Date.now(), name: customName, amount: amount, timestamp: Date.now() } }));
    }

    function controlDice(command) { if(client.connected) client.publish(topic, JSON.stringify({ type: 'dice_roll', payload: command })); }
  </script>
</body>
</html>
