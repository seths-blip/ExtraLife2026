<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extra Life 24H Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #FFF; padding: 20px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto 20px auto; border-bottom: 2px solid #333; padding-bottom: 15px; }
    .header h1 { margin: 0; color: #D4AF37; font-size: 26px; }
    #status-badge { font-size: 14px; padding: 6px 14px; border-radius: 20px; background: #FF5555; color: white; font-weight: bold; }
    
    /* Reorganized into a tighter 3-column layout */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
    .panel { background: #2a2a2a; padding: 18px; border-radius: 10px; border-top: 4px solid #D4AF37; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
    .panel h2 { margin-top: 0; color: #FFF; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
    
    .control-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
    .control-group label { flex: 1; min-width: 110px; font-size: 13px; color: #ccc; font-weight: 500; }
    .input-box { flex: 2; display: flex; gap: 8px; align-items: center; }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #D4AF37; }
    input[type="text"], input[type="number"], input[type="datetime-local"], select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: white; font-size: 13px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #D4AF37; }
    button { background: #D4AF37; color: #000; font-weight: bold; border: none; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 6px; width: 100%; transition: background 0.2s; margin-top: auto; }
    button:hover { background: #b8962c; }
    .btn-special { background: #55FF55; margin-top: 10px; } .btn-special:hover { background: #32CD32; }
    .btn-dice { background: #FF5555; color: #FFF; margin-top: 10px; } .btn-dice:hover { background: #CC0000; }
    
    #playlist-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; background: #1e1e1e; border-radius: 8px; padding: 8px; margin-bottom: 12px; border: 1px solid #444; }
    .playlist-card { background: #333; border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
    .playlist-card:hover { background: #444; border-color: #55FF55; transform: translateY(-2px); }
    .playlist-art { width: 100%; aspect-ratio: 1; border-radius: 4px; object-fit: cover; background: #000; margin-bottom: 4px; }
    .playlist-title { font-weight: bold; color: #55FF55; font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-artist { font-size: 10px; color: #aaa; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    hr { border-color: #444; width: 100%; margin: 12px 0; border-style: solid; border-bottom: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎮 Extra Life 24H Dashboard</h1>
    <span id="status-badge">🔴 CONNECTING...</span>
  </div>

  <div class="dashboard-grid">
    
    <!-- PANEL 1: CORE OVERLAY -->
    <div class="panel">
      <h2>⏱️ Core Overlay</h2>
      <div class="control-group">
        <label>Clock Position</label>
        <div class="input-box">
          <input type="checkbox" id="clock-show" checked onchange="updateConfig()"> Show
          <select id="clock-pos" onchange="updateConfig()">
            <option value="top-left">Top Left</option>
            <option value="top-center">Top Center</option>
            <option value="top-right">Top Right</option>
            <option value="center">Dead Center</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-center">Bottom Center</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label>Scale & Target</label>
        <div class="input-box">
          <input type="number" step="0.1" id="clock-scale" value="1.0" onchange="updateConfig()">
          <input type="datetime-local" id="target-time" onchange="updateConfig()">
        </div>
      </div>
      <hr>
      <div class="control-group">
        <label>Bottom Ticker</label>
        <div class="input-box">
          <input type="checkbox" id="ticker-show" checked onchange="updateConfig()"> Show Ticker
          <input type="checkbox" id="ticker-bar" checked onchange="updateConfig()"> Progress Bar
        </div>
      </div>
      <div class="control-group">
        <label>Custom Event Msg</label>
        <div class="input-box">
          <input type="text" id="ticker-custom" placeholder="e.g. BEAN BOOZLED SPUN!">
        </div>
      </div>
      <div class="control-group">
        <label>Loops to Run</label>
        <div class="input-box">
          <input type="number" id="ticker-loops" value="3">
          <button onclick="stageCustomText()" style="margin:0;">Stage Msg</button>
        </div>
      </div>
    </div>

    <!-- PANEL 2: MEDIA & WIDGETS -->
    <div class="panel">
      <h2>🎵 Media & Widgets</h2>
      <div class="control-group">
        <label>🎸 Band Effects</label>
        <div class="input-box">
          <input type="checkbox" id="band-show" onchange="updateConfig()"> Show Layer
          <input type="text" id="band-url" value="./band-effects.html" placeholder="./band-effects.html" onchange="updateConfig()">
        </div>
      </div>
      <hr>
      <div id="playlist-container"></div>
      
      <div class="control-group">
        <label>Slide Position</label>
        <div class="input-box">
          <select id="np-pos" onchange="updateConfig()">
            <option value="top-left">Top Left</option>
            <option value="top-center">Top Center</option>
            <option value="top-right">Top Right</option>
            <option value="center">Dead Center</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-center">Bottom Center</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label>Manual Track</label>
        <div class="input-box">
          <input type="text" id="np-title" placeholder="Title">
          <input type="text" id="np-artist" placeholder="Artist">
        </div>
      </div>
      <button class="btn-special" onclick="triggerManualTrack()">▶ PUSH MANUAL TRACK</button>
    </div>

    <!-- PANEL 3: LIVE ACTION -->
    <div class="panel">
      <h2>⚔️ Live Action</h2>
      <div class="control-group">
        <label>🎲 Dice of Doom</label>
        <div class="input-box">
          <input type="checkbox" id="dice-show" checked onchange="updateConfig()"> Show Overlay
        </div>
      </div>
      <button class="btn-dice" onclick="sendPayload('dice_roll', null)">🎲 ROLL THE DICE OF DOOM 🎲</button>
      <hr>
      <div class="control-group">
        <label>Alert Position</label>
        <div class="input-box">
          <select id="alert-pos" onchange="updateConfig()">
            <option value="top-left">Top Left</option>
            <option value="top-center">Top Center</option>
            <option value="top-right">Top Right</option>
            <option value="center">Dead Center</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-center">Bottom Center</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label>Manual Alert</label>
        <div class="input-box">
          <input type="text" id="alert-name" placeholder="Donor">
          <input type="number" id="alert-amount" placeholder="$ Amount">
        </div>
      </div>
      <button onclick="sendManualAlert()">Push Alert</button>
      <hr>
      <div class="control-group">
        <label>Audio & Sparks</label>
        <div class="input-box">
          <input type="checkbox" id="effect-sound" checked onchange="updateConfig()"> Sound
          <input type="checkbox" id="effect-visual" checked onchange="updateConfig()"> Sparks
        </div>
      </div>
      <button class="btn-special" onclick="sendPayload('confetti', null)">🎉 FIRE CONFETTI CANNON</button>
    </div>

  </div>

  <script>
    const teamID = "74089"; 
    const topicName = `extralife2026/${teamID}/commands`;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const myClientID = Math.random().toString(36).substring(2, 10);
    let isNetworkSyncing = false;
    let playlistTracks = [{ title: "Marathon Theme", artist: "Extra Life 2026", art: "./stream-player/images/image_ef100c.png" }];

    client.on('connect', () => {
      const badge = document.getElementById('status-badge');
      badge.innerHTML = "🟢 CONNECTED (MULTIPLAYER)";
      badge.style.background = "#55FF55";
      badge.style.color = "black";
      updateConfig(true); 
    });

    client.on('message', (topic, message) => {
      try { 
        const data = JSON.parse(message.toString()); 
        if (data.type === 'request_sync') setTimeout(() => updateConfig(true), Math.random() * 1000);
        if (data.type === 'config' && data.sender !== myClientID) syncUIFromNetwork(data.payload);
      } catch(e) {}
    });
    
    client.subscribe(topicName);

    function sendPayload(type, payload, retain = false) {
      if (client.connected) {
        client.publish(topicName, JSON.stringify({ type, payload, sender: myClientID }), { retain: retain });
      }
    }

    function renderPlaylist(tracks) {
      const container = document.getElementById('playlist-container');
      container.innerHTML = '';
      tracks.forEach(track => {
        const title = track.title || track.name || "Track";
        const artist = track.artist || track.author || "Artist";
        
        let art = track.art || track.artwork || track.cover || track.image || "./stream-player/images/image_ef100c.png";
        if (!art.startsWith("http")) {
            art = art.replace(/^\.?\//, '');
            if (art.startsWith('images/')) art = './stream-player/' + art;
            else if (!art.startsWith('stream-player/')) art = './stream-player/images/' + art;
            else art = './' + art;
        }

        const div = document.createElement('div');
        div.className = 'playlist-card';
        div.innerHTML = `
          <img src="${art}" class="playlist-art" alt="art" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/c/ca/CD-ROM.png';">
          <span class="playlist-title">${title}</span>
          <span class="playlist-artist">${artist}</span>
        `;
        div.onclick = () => {
          sendPayload('now_playing', { title: title, artist: artist, art: art, pos: document.getElementById('np-pos').value });
          div.style.borderColor = "#D4AF37";
          setTimeout(() => div.style.borderColor = "transparent", 600);
        };
        container.appendChild(div);
      });
    }

    function triggerManualTrack() {
      sendPayload('now_playing', {
        title: document.getElementById('np-title').value || "Marathon Track",
        artist: document.getElementById('np-artist').value || "Extra Life",
        art: "./stream-player/images/image_ef100c.png",
        pos: document.getElementById('np-pos').value
      });
    }

    function updateConfig(force = false) {
      if (isNetworkSyncing && !force) return;
      const config = {
        clock: { show: document.getElementById('clock-show').checked, pos: document.getElementById('clock-pos').value, scale: document.getElementById('clock-scale').value },
        bandEffects: { show: document.getElementById('band-show').checked, url: document.getElementById('band-url').value, pos: 'top-left', width: 1920, height: 1080 },
        diceOfDoom: { show: document.getElementById('dice-show').checked, url: "./dice.html", pos: 'top-left', width: 1920, height: 1080 },
        ticker: { show: document.getElementById('ticker-show').checked, showProgressBar: document.getElementById('ticker-bar').checked },
        alerts: { pos: document.getElementById('alert-pos').value },
        effects: { sound: document.getElementById('effect-sound').checked, visual: document.getElementById('effect-visual').checked },
        targetTime: document.getElementById('target-time').value ? new Date(document.getElementById('target-time').value).getTime() : null
      };
      
      sendPayload('config', config, true);
      localStorage.setItem('extralife_cfg', JSON.stringify(config));
    }

    function syncUIFromNetwork(cfg) {
      isNetworkSyncing = true;
      try {
        if (cfg.clock) { document.getElementById('clock-show').checked = cfg.clock.show; document.getElementById('clock-pos').value = cfg.clock.pos; document.getElementById('clock-scale').value = cfg.clock.scale; }
        if (cfg.bandEffects) { document.getElementById('band-show').checked = cfg.bandEffects.show; document.getElementById('band-url').value = cfg.bandEffects.url; }
        if (cfg.diceOfDoom) { document.getElementById('dice-show').checked = cfg.diceOfDoom.show; }
        if (cfg.ticker) { document.getElementById('ticker-show').checked = cfg.ticker.show; document.getElementById('ticker-bar').checked = cfg.ticker.showProgressBar; }
        if (cfg.alerts) document.getElementById('alert-pos').value = cfg.alerts.pos;
        if (cfg.effects) { document.getElementById('effect-sound').checked = cfg.effects.sound; document.getElementById('effect-visual').checked = cfg.effects.visual; }
        if (cfg.targetTime) {
          let d = new Date(cfg.targetTime);
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          document.getElementById('target-time').value = d.toISOString().slice(0, 16);
        }
      } catch(e) {}
      isNetworkSyncing = false;
    }

    function stageCustomText() {
      const inputBox = document.getElementById('ticker-custom');
      sendPayload('stage_ticker', { text: inputBox.value, loops: parseInt(document.getElementById('ticker-loops').value) || 1 });
      
      // Auto-wipes the text box so you don't have to manually delete it
      inputBox.value = "";
    }

    function sendManualAlert() {
      sendPayload('alert', { name: document.getElementById('alert-name').value || "Anonymous", amount: document.getElementById('alert-amount').value || "0", timestamp: Date.now() });
      document.getElementById('alert-name').value = ""; document.getElementById('alert-amount').value = "";
    }

    fetch('./stream-player/playlist.json')
      .then(r => r.json())
      .then(data => { playlistTracks = Array.isArray(data) ? data : (data.tracks || data.playlist || []); renderPlaylist(playlistTracks); })
      .catch(() => renderPlaylist(playlistTracks));

    const saved = localStorage.getItem('extralife_cfg');
    if (saved) { 
      try { syncUIFromNetwork(JSON.parse(saved)); } catch(e) {} 
    }

    const tInput = document.getElementById('target-time');
    if (!tInput.value) {
      const d = new Date(Date.now() + 86400000);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      tInput.value = d.toISOString().slice(0, 16);
    }
  </script>
</body>
</html>
