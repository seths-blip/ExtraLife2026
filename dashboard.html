<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extra Life 2026 - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      background-color: #111; color: #FFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    }
    h1 { color: #D4AF37; font-family: 'VT323', monospace; font-size: 48px; margin-bottom: 10px; text-shadow: 0 0 10px #D4AF37; }
    .panel { background: #222; border: 2px solid #D4AF37; border-radius: 10px; padding: 20px; width: 100%; max-width: 600px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
    h2 { margin-top: 0; color: #55FF55; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
    
    .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    label { font-size: 18px; font-weight: bold; }
    
    input[type="text"], input[type="number"], input[type="datetime-local"], select {
      width: calc(100% - 24px); padding: 10px; margin-bottom: 15px; background: #333; color: #FFF; 
      border: 1px solid #55FF55; border-radius: 5px; font-size: 16px;
    }
    select { width: 100%; cursor: pointer; }
    
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #55FF55; box-shadow: 0 0 10px #55FF55; }
    input:checked + .slider:before { transform: translateX(22px); }

    button {
      background: #333; color: #FFF; border: 2px solid #55FF55; padding: 10px 20px; font-size: 16px; 
      font-weight: bold; border-radius: 5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; width: 100%; margin-bottom: 10px;
    }
    button:hover { background: #55FF55; color: #000; box-shadow: 0 0 15px #55FF55; }
    
    .btn-red { border-color: #FF5555; }
    .btn-red:hover { background: #FF5555; color: #FFF; box-shadow: 0 0 15px #FF5555; }
    .btn-gold { border-color: #D4AF37; }
    .btn-gold:hover { background: #D4AF37; color: #000; box-shadow: 0 0 15px #D4AF37; }
    .flex-row { display: flex; gap: 10px; }
    
    #status { font-weight: bold; color: #FF5555; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .connected { color: #55FF55 !important; text-shadow: 0 0 10px #55FF55; }
  </style>
</head>
<body>

  <h1>Control Room</h1>
  <div id="status">MQTT Status: Disconnected</div>

  <!-- GLOBAL SETTINGS -->
  <div class="panel">
    <h2>Global Settings & Timers</h2>
    <div class="control-group">
      <label>Global Sound Effects</label>
      <label class="switch"><input type="checkbox" id="enable-sound" checked onchange="sendConfig()"><span class="slider"></span></label>
    </div>
    <label style="font-size: 14px; color: #AAA;">Marathon End Time (Countdown Target):</label>
    <input type="datetime-local" id="marathon-end" onchange="updateTimer()">
  </div>

  <!-- WIDGET TOGGLES -->
  <div class="panel">
    <h2>Widget Visibility</h2>
    <div class="control-group"><label>Top Clock</label><label class="switch"><input type="checkbox" id="show-clock" checked onchange="sendConfig()"><span class="slider"></span></label></div>
    <div class="control-group"><label>Bottom Ticker</label><label class="switch"><input type="checkbox" id="show-ticker" checked onchange="sendConfig()"><span class="slider"></span></label></div>
    <div class="control-group"><label>Band Effects Layer</label><label class="switch"><input type="checkbox" id="show-band" checked onchange="sendConfig()"><span class="slider"></span></label></div>
    <div class="control-group"><label>Dice of Doom Layer</label><label class="switch"><input type="checkbox" id="show-dice" checked onchange="sendConfig()"><span class="slider"></span></label></div>
  </div>

  <!-- CUSTOM TICKER -->
  <div class="panel">
    <h2>Stage Custom Ticker</h2>
    <input type="text" id="ticker-msg" placeholder="ENTER CUSTOM MESSAGE (e.g. WE REACHED $500!)">
    <div class="control-group" style="justify-content: flex-start; gap: 15px;">
      <label style="font-size: 14px; color: #AAA;">Number of Loops:</label>
      <input type="number" id="ticker-loops" value="3" min="1" max="20" style="width: 80px; margin-bottom: 0;">
    </div>
    <button onclick="sendTickerMessage()">Push to Stream</button>
  </div>

  <!-- NOW PLAYING OVERRIDE WITH PLAYLIST PARSER -->
  <div class="panel">
    <h2>Now Playing Override</h2>
    <select id="playlist-dropdown" onchange="populateMusicFields()">
        <option value="">-- Load from playlist.json --</option>
    </select>
    <input type="text" id="np-title" placeholder="Track Title">
    <input type="text" id="np-artist" placeholder="Artist Name">
    <button class="btn-gold" onclick="sendNowPlaying()">Show Now Playing Graphic</button>
  </div>

  <!-- DICE OF DOOM -->
  <div class="panel">
    <h2>Dice of Doom Controls</h2>
    <div class="flex-row">
      <button class="btn-red" onclick="controlDice('ROLL_DICE')">🎲 Roll Dice 🎲</button>
      <button onclick="controlDice('RESET_DICE')">Reset to Skull</button>
    </div>
  </div>

  <!-- MANUAL ALERTS -->
  <div class="panel">
    <h2>Manual Triggers & Tests</h2>
    <button class="btn-red" onclick="fireConfetti()" style="margin-bottom: 20px;">🎉 Fire Confetti Cannon 🎉</button>
    <p style="color: #AAA; font-size: 14px; margin-top: -5px; margin-bottom: 10px;">Test Visual Alert Tiers:</p>
    <div class="flex-row">
      <button onclick="sendTestAlert(5)">Test $5 (Lighters)</button>
      <button onclick="sendTestAlert(25)">Test $25 (Confetti)</button>
      <button class="btn-gold" onclick="sendTestAlert(50)">Test $50 (Stage)</button>
    </div>
  </div>

  <button class="btn-gold" style="max-width: 600px;" onclick="sendConfig()">Force Global Resync</button>

  <script>
    const teamID = "74089";
    const topic = `extralife2026/${teamID}/commands`;
    let loadedPlaylist = [];
    
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    
    // 1. Initialize Dashboard State
    client.on('connect', () => {
      document.getElementById('status').innerText = "MQTT Status: Connected & Live";
      document.getElementById('status').classList.add('connected');
      client.subscribe(topic);
      
      // Load saved timer to prevent refresh-amnesia
      const savedTime = localStorage.getItem('extralife_marathon_end');
      if (savedTime) {
          document.getElementById('marathon-end').value = savedTime;
      } else {
          const now = new Date(); now.setHours(now.getHours() + 24);
          const localISOString = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
          document.getElementById('marathon-end').value = localISOString;
      }
      
      loadPlaylist();
      sendConfig();
    });

    client.on('message', (t, msg) => {
      try { if(JSON.parse(msg.toString()).type === 'request_sync') sendConfig(); } catch(e){}
    });

    function updateTimer() {
        localStorage.setItem('extralife_marathon_end', document.getElementById('marathon-end').value);
        sendConfig();
    }

    // 2. Playlist.json Loader
    async function loadPlaylist() {
        try {
            const res = await fetch('./playlist.json');
            loadedPlaylist = await res.json();
            const dropdown = document.getElementById('playlist-dropdown');
            loadedPlaylist.forEach((track, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${track.title} - ${track.artist}`;
                dropdown.appendChild(opt);
            });
        } catch(err) {
            console.error("Could not load playlist.json. Ensure formatting is correct.", err);
        }
    }

    function populateMusicFields() {
        const idx = document.getElementById('playlist-dropdown').value;
        if(idx !== "" && loadedPlaylist[idx]) {
            document.getElementById('np-title').value = loadedPlaylist[idx].title;
            document.getElementById('np-artist').value = loadedPlaylist[idx].artist;
        }
    }

    // 3. Network Commands
    function sendConfig() {
      if(!client.connected) return;
      const endTimeValue = document.getElementById('marathon-end').value;
      const targetTimeMs = endTimeValue ? new Date(endTimeValue).getTime() : (new Date().getTime() + 86400000);

      client.publish(topic, JSON.stringify({ 
          type: 'config', 
          payload: {
            clock: { show: document.getElementById('show-clock').checked, pos: 'top-right', scale: 1 },
            ticker: { show: document.getElementById('show-ticker').checked, showProgressBar: true },
            alerts: { pos: 'center' },
            targetTime: targetTimeMs,
            effects: { sound: document.getElementById('enable-sound').checked, visual: true },
            bandEffects: { show: document.getElementById('show-band').checked, url: './band-effects.html', pos: 'center', width: 1920, height: 1080 },
            diceOfDoom: { show: document.getElementById('show-dice').checked, url: './dice.html?transparent=1', pos: 'center', width: 1920, height: 1080 }
          }
      }));
    }

    function sendTickerMessage() {
      if(!client.connected) return;
      const text = document.getElementById('ticker-msg').value;
      if (text.trim() === "") return;
      client.publish(topic, JSON.stringify({ type: 'stage_ticker', payload: { text: text, loops: parseInt(document.getElementById('ticker-loops').value) || 3 } }));
      document.getElementById('ticker-msg').value = "";
    }

    function sendNowPlaying() {
      if(!client.connected) return;
      client.publish(topic, JSON.stringify({ 
        type: 'now_playing', 
        payload: { title: document.getElementById('np-title').value || "Track", artist: document.getElementById('np-artist').value || "Artist", pos: 'top-left' } 
      }));
    }

    function fireConfetti() {
      if(client.connected) client.publish(topic, JSON.stringify({ type: 'confetti' }));
    }

    function sendTestAlert(amount) {
      if(client.connected) {
          client.publish(topic, JSON.stringify({ type: 'alert', payload: { id: 'TEST_' + Date.now(), name: "Test Hero", amount: amount, timestamp: Date.now() } }));
      }
    }

    function controlDice(command) {
      if(client.connected) client.publish(topic, JSON.stringify({ type: 'dice_roll', payload: command }));
    }
  </script>
</body>
</html>
