/*
  EPIC CINEMATIC D&D TIMER
  ------------------------------------------------------------------
  OBS Browser Source (transparent). Works for countdowns from under a minute up to 30+ minutes:
    ?minutes=5   ?minutes=10   ?minutes=15   ?minutes=30   (hours/seconds also accepted)
    ?target=2026-10-09T18:00:00                 count down to a clock time instead
    ?preview=1                                  dark backdrop for testing in a normal browser
    ?skip=290                                   jump N seconds into the countdown (e.g. to preview the finale)

  THE STORY: the fighters level up as the fight escalates. The number of acts scales with the countdown:
    up to 8 min:   Knight vs Barbarian -> Ranger vs Lancer -> Cleric vs Wizard
    longer:        Knight vs Barbarian -> Rogue vs Monk -> Ranger vs Lancer -> Cleric vs Wizard
  Green always finishes as the wizard, who casts the fireball. The timer is part of the arena: fighters vault onto its
  top edge, get thrown into its sides, and run behind it. One d20 roll and one mimic chest appear per five minutes,
  spread apart. Every minute mark in the last five gets a hype pulse, bigger at 1:00 and 0:30.
*/
(() => {
'use strict';

/* ============================================================
   TIME / URL
   ============================================================ */
/* ====== SETTINGS: edit these if you can't use URL options (e.g. when pasting this file in as HTML) ====== */
const CONFIG = {
    hours: 0,
    minutes: 15,           // <- countdown length (5, 10, 15, 30 ...)
    seconds: 0,
    target: '',            // optional: count down to a clock time instead, e.g. '2026-10-09T18:00:00'
    debug: false           // true (or add ?debug=1 to the URL) shows a small status readout in the corner
};
/* ================================================================================================== */
const qs = new URLSearchParams(location.search);
const qnum = k => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : null; };
const hasTime = ['hours', 'minutes', 'seconds'].some(k => qnum(k) !== null);
let spanSec = hasTime ? (qnum('hours') || 0) * 3600 + (qnum('minutes') || 0) * 60 + (qnum('seconds') || 0) : CONFIG.hours * 3600 + CONFIG.minutes * 60 + CONFIG.seconds;
if (spanSec <= 0) spanSec = 1;
let clockOffset = (qnum('skip') || 0) * 1000;
const T0 = Date.now();
let endWall = T0 + spanSec * 1000;
const targetStr = qs.get('target') || CONFIG.target;
if (targetStr) { const t = Date.parse(targetStr); if (!isNaN(t) && t > T0) endWall = t; }
const spanMs = endWall - T0;
const nowMs = () => Date.now() + clockOffset;
if (qs.get('preview')) document.body.classList.add('preview');

/* ============================================================
   CANVAS / SCALE
   ============================================================ */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, S = 1, u = 1.5, floorY = 0;
function resize() {
    const pw = W;
    W = canvas.width = window.innerWidth || document.documentElement.clientWidth || 0;
    H = canvas.height = window.innerHeight || document.documentElement.clientHeight || 0;
    S = Math.min(H / 1080, W / 1500);
    u = S * 1.75;                // 1 rig unit in px
    floorY = H * 0.86;
    if (pw > 0 && W > 0 && W !== pw && typeof red !== 'undefined') for (const f of [red, green]) if (isFinite(f.x)) f.x *= W / pw;   // keep the fighters in place if the layer is resized
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   MATH
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const frac = v => v - Math.floor(v);
const sgn = v => (v < 0 ? -1 : 1);
const EASE = {
    l: t => t,
    i: t => t * t * t,
    o: t => 1 - Math.pow(1 - t, 3),
    io: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    s: t => t * t * (3 - 2 * t)
};

/* ============================================================
   COROUTINE SCHEDULER  (lets the fight be scripted top-to-bottom)
   ============================================================ */
const wait = s => ({ t: s, update(d) { this.t -= d; return this.t <= 0; } });
const until = fn => ({ update() { return fn(); } });
const norm = v => {
    if (v instanceof Co) return until(() => v.done);
    if (Array.isArray(v)) { const ws = v.map(norm); return { update(d) { let ok = true; for (const w of ws) { if (w.fin) continue; if (w.update(d)) w.fin = true; else ok = false; } return ok; } }; }
    return v;
};
class Co {
    constructor(gen) { this.gen = gen; this.w = null; this.done = false; }
    tick(d) {
        if (this.done) return;
        for (let g = 0; g < 64; g++) {
            if (this.w) { if (!this.w.update(d)) return; this.w = null; }
            d = 0;
            const r = this.gen.next();
            if (r.done) { this.done = true; return; }
            this.w = norm(r.value);
        }
    }
    kill() { this.done = true; try { this.gen.return(); } catch (e) {} }
}
let cos = [];
const spawn = gen => { const c = new Co(gen); cos.push(c); return c; };

   RIG POSES

        this.goal = null; this.anim = null; this.override = null;

        this.phase = 0; this.speed = 0; this.gait = 'idle'; this.time = Math.random() * 9; this.charge = 0;
        this.scarf = Array.from({ length: 7 }, () => ({ x: 0, y: 0, ox: 0, oy: 0 })); this.scarfInit = false;
        this.tip = null; this.btip = null; this.foot = { x: 0, y: 0 }; this.chest = { x: 0, y: 0 }; this.bhand = { x: 0, y: 0 }; this.orb = { x: 0, y: 0 }; this.nock = { x: 0, y: 0 };
        this.trail = []; this.aimLean = 0; this.lastStep = 0; this.frozen = null;
        this.cls = 'knight'; this.reach = 54; this.onPlat = false; this.platOK = false; this.hidden = false; this.ghost = 0; this.surge = false; this.snaps = []; this.snapT = 0; this.stayDown = false; this.hotCd = 0;
        this.gs = 1; this.tumble = false; this.trot = 0; this.tspin = 0; this.autoFace = true; this.opp = null; this.trailOn = false;
    }
    get sc() { return 1 - 0.38 * this.z; }
    get gy() { return floorY - this.z * H * 0.30; }
    get U() { return u * this.sc; }
    get sy() { return this.gy - (this.onPlat ? PLAT.E : 0) * this.U; }   // y of whatever the fighter is standing on

    play(name, o = {}) {
        const c = C[name]; if (!c) return;
        if (this.tumble && name !== 'slam') return;
        this.anim = { c, t: 0, speed: o.speed || 1, on: o.on || {}, fired: new Set(), lean: o.lean || 0 };
    }
    get guarding() { const a = this.anim; if (!a || !a.c.guard) return false; const g = a.c.gw || [0, a.c.dur]; return a.t >= g[0] && a.t <= g[1]; }

/* ============================================================
   AUDIT: a built-in watchdog used while developing; flags anything that "doesn't make sense"
   ============================================================ */
const AUD = { on: false, tm: {}, issues: [], imps: [], ov: 0, idleT: 0, idleFlag: false, airT: { red: 0, green: 0 } };

function auditImpact(att, def, clip, outcome) {
    att.draw(); def.draw();      // refresh tracked positions (the harness doesn't render every tick)
    const cc = C[clip], tp = cc.back ? (att.btip || att.bhand) : cc.foot ? att.foot : clip === 'bash' ? att.bhand : tipOf(att);
    const dx = (tp.x - def.x) * att.dir / u, dy = Math.abs(tp.y - def.chest.y) / u;
    AUD.imps.push({ clip, cls: att.cls, outcome, dx: +dx.toFixed(0), dy: +dy.toFixed(0) });
    if (outcome !== 'dodge') {
        if (dx < -26) audAdd('short', `${att.cls} ${clip} fell ${(-dx).toFixed(0)}u short of ${def.cls}`);
        else if (dx > 55) audAdd('long', `${att.cls} ${clip} went ${dx.toFixed(0)}u past ${def.cls}`);
        if (dy > 95) audAdd('vert', `${att.cls} ${clip} ${dy.toFixed(0)}u off target height`);
    }
    if (Math.sign(def.x - att.x) !== att.dir) audAdd('facing', `${att.cls} ${clip} facing away`);

}
function auditTick(dt) {
    {   // how long are they moving together, close together?
        const bt = window.__beat || '-', m = AUD.tm[bt] || (AUD.tm[bt] = { t: 0, both: 0, tandem: 0, near: 0, drift: 0 });
        const a = red, b = green; m.t += dt;
        if (a.visible && b.visible && a.air < 8 && b.air < 8) {
            const mv = a.speed > 120 && b.speed > 120, d = Math.abs(a.x - b.x) / u;
            if (mv) m.both += dt;
            if (mv && d < 150) m.tandem += dt;
            if (d < 60) m.near += dt;
            const c = (a.x + b.x) / 2; if (AUD.lc !== undefined) m.drift += Math.abs(c - AUD.lc) / u; AUD.lc = c;
        }
    }
    for (const f of [red, green]) {
        if (!f.visible) continue;
        if (!isFinite(f.x) || !isFinite(f.air) || !isFinite(f.z)) audAdd('nan', f.id);
        if (f.x < -5 || f.x > W + 5) audAdd('offscreen', f.id);
        if (f.air > 3 && !f.fly && !f.jumping && !f.tumble && !f.onPlat) { AUD.airT[f.id] += dt; if (AUD.airT[f.id] > 1) { audAdd('airstuck', f.id); AUD.airT[f.id] = 0; } } else AUD.airT[f.id] = 0;
    }
    const a = red, b = green;
    if (a.visible && b.visible && !a.hidden && !b.hidden && !a.tumble && !b.tumble && a.air < 8 && b.air < 8 && Math.abs(a.x - b.x) < 30 * u && !a.panic) AUD.ov += dt; else AUD.ov = 0;
    if (AUD.ov > 0.5) { audAdd('overlap', 'fighters stacked'); AUD.ov = 0; }
    const idle = f => !f.anim && !f.goal && !f.override && !f.tumble && !f.hidden && f.speed < 5 && f.air < 3;

    if (AUD.idleT > 1.4 && !AUD.idleFlag) { AUD.idleFlag = true; audAdd('idle', `both idle ${AUD.idleT.toFixed(1)}s`); }
}

/* ============================================================
   FIGHT BEATS
   ============================================================ */
let prog = 0;   // 0..1 progress through the countdown

function* intro() {
    red.x = W * rnd(0.2, 0.34); green.x = W * rnd(0.66, 0.8);
    red.air = H / u + rnd(20, 120); green.air = H / u + rnd(120, 360); red.vy = green.vy = 0;
    yield until(() => red.air <= 0 && green.air <= 0);
    yield wait(0.7);
}
function* standoff() {
    settle();
    yield* spacing(300, null, WALK * 1.8);
    const first = Math.random() < 0.5 ? red : green, second = first === red ? green : red;
    first.play(tauntClip(first)); yield wait(rnd(0.4, 0.8));
    if (Math.random() < 0.8) second.play(tauntClip(second));
    yield until(() => !red.anim && !green.anim);
    yield wait(0.2);
    const [L, R] = sides();
    yield [go(L, L.x + rnd(30, 60) * u, WALK), go(R, R.x - rnd(30, 60) * u, WALK)];
    yield wait(rnd(0.3, 0.8));
}

/* set-pieces that can break up a brawl */
function* spice() {
    const r = Math.random();
    if (r < 0.28) {                       // back off, then charge head-on
        const [L, R] = sides(), c = (L.x + R.x) / 2;
        yield [go(L, c - 250 * u, RUN * 1.25), go(R, c + 250 * u, RUN * 1.25)];
        yield wait(0.25);
        yield [go(L, c - 62 * u, RUN * 1.7), go(R, c + 62 * u, RUN * 1.7)];
        yield* clashStrike(1.25);
    } else if (r < 0.54) {                // vault clean over the opponent
        const a = Math.random() < 0.5 ? red : green, d = a === red ? green : red, dir = Math.sign(d.x - a.x) || 1;
        a.play('hopArms'); a.jumpTo(clamp(d.x + dir * 150 * u, W * 0.06, W * 0.94), rnd(150, 230));
        yield until(() => a.air <= 0);
        yield wait(0.1);
    } else if (r < 0.82) {                // circle round to the other side
        yield* swapSides();
    } else {                              // someone mocks the other
        const f = Math.random() < 0.5 ? red : green;
        yield act(f, tauntClip(f));
    }
}

/* continuous melee: combos, counters, launches. Each brawl rolls its own personality. */
function* brawl(rounds, frenzy) {
    settle();
    const style = frenzy ? 'brutal' : pick(['aggressive', 'cagey', 'brutal', 'aggressive']);
    const P = { aggressive: { len: 0.45, hit: 0.5, dodge: 0.22, spice: 0.14 }, cagey: { len: 0.2, hit: 0.3, dodge: 0.4, spice: 0.28 }, brutal: { len: 0.55, hit: 0.62, dodge: 0.14, spice: 0.08 } }[style];
    yield* spacing(150, null, RUN);
    yield wait(0.1);
    let att = Math.random() < 0.5 ? red : green;
    const base = 1 + prog * 0.3 + (frenzy ? 0.28 : 0), home = midX();
    for (let i = 0; i < rounds; i++) {
        if (endNear()) break;
        const drift = (midX() - home) / W;
        if (Math.abs(drift) > 0.12 && Math.random() < 0.85) { const [L, R] = sides(); att = drift > 0 ? R : L; }   // pressure them back toward where it started
        const def = att === red ? green : red, spd = base * rnd(0.95, 1.1);
        if (!frenzy && Math.random() < P.spice) { yield* spice(); att = Math.random() < 0.5 ? red : green; continue; }
        if (Math.random() < 0.12 + prog * 0.1) { yield* clashStrike(spd); att = Math.random() < 0.5 ? red : green; continue; }
        if (!frenzy && Math.random() < 0.1 && clsOf(att).atk.includes('kick')) { yield* flyKickStrike(att, def); continue; }
        const len = 1 + (Math.random() < P.len + prog * 0.3) + (Math.random() < prog * 0.5) + (frenzy && Math.random() < 0.6 ? 1 : 0);
        for (let k = 0; k < len; k++) {
            const last = k === len - 1, r = Math.random();
            let outcome, clip = pick(atkPool(att));
            if (last && r < P.hit + prog * 0.2) { outcome = 'hit'; if (Math.random() < 0.55 + prog * 0.3) clip = heavyOf(att); }
            else { const r2 = Math.random(); outcome = r2 < P.dodge ? 'dodge' : (!last && r2 < P.dodge + 0.12) ? 'hit' : 'block'; }
            if (clip === 'sweep') outcome = Math.random() < 0.6 ? 'dodge' : 'hit';       // low attack: hop it or get tripped
            yield* strike(att, def, clip, outcome, spd);
            if (isDown(def)) { yield* chaseDown(att, def); break; }
        }
        if (Math.random() < 0.65) att = def;
        yield wait(frenzy ? 0.03 : rnd(0.05, 0.25));
    }
}


function* flyKickStrike(att, def) {              // a running jump with a flying kick
    const dir = Math.sign(def.x - att.x) || 1, gap = gapFor(att, 'flyKick', 1);
    yield* closeIn(att, def, 230);
    att.dir = dir;
    const out = pick(['block', 'hit', 'dodge']);
    att.play('flyKick');
    att.jumpTo(att.x + 2 * (def.x - dir * gap * u - att.x), 70);
    yield wait(0.17);
    if (out === 'block') def.play(blockClip(def)); else if (out === 'dodge') def.play(Math.random() < 0.5 ? 'rollBack' : 'sidestep');
    yield wait(0.13);
    if (AUD.on) auditImpact(att, def, 'flyKick', out);
    impact(att, def, out, 1.1);
    yield until(() => att.air <= 0 && !att.anim && !def.anim && !def.tumble);
}

/* ranger (arrows) or monk (chi blasts) pepper the other from range, who parries, hops and rolls */

    settle();
    const sh = [red, green].find(f => f.cls === 'ranger' || f.cls === 'monk'), tg = sh === red ? green : red, bow = sh.cls === 'ranger';
    yield* spacing(rnd(520, 680), null, RUN);

    if (bow) { kit(sh, 'bow'); sparks(sh.chest.x, sh.chest.y, 8, 0.5, ['255,255,255', '255,230,150']); }
    const n = 2 + (prog > 0.4 ? 1 : 0) + (Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < n; i++) {
        let shot; sh.play(bow ? 'shoot' : 'palm', { on: { fire: f => { shot = shoot(f, bow ? 'arrow' : 'chi', tg); } } });
        yield until(() => !!shot);

    for (let k = 0; k < 3 && def.tumble; k++) {

/* grab, hoist overhead and slam */
function heldPose(f) { return pz(LYING); }
function liftPose(f) { return pz({ fa: 3.0, fb: 0.2, ba: 3.0, bb: 0.2, lean: -0.2, hh: 40, ffx: 14, bfx: -14, fw: 3.0 }); }

    settle();
    yield* spacing(150, null, RUN); yield wait(0.15);

    yield* closeIn(att, def, 74);

}

/* sprint straight through the opponent in a blur, then sheathe: the cut lands a moment later */
function* dashBeat() {
    settle();
    yield* spacing(rnd(380, 460), null, RUN); yield wait(0.25);
    const att = pick([red, green].filter(f => ['knight', 'ranger', 'rogue', 'barbarian', 'cleric'].includes(f.cls))), def = att === red ? green : red, dir = Math.sign(def.x - att.x) || 1;

    g.addColorStop(0, `rgba(255,110,30,${0.28 * FIN.grow + 0.05})`); g.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 2.4, 0, TAU); ctx.fill();
    // roiling lobes
    for (let i = 0; i < 12; i++) {
        const a = t * (0.9 + (i % 3) * 0.3) + i * 0.52, rr = R * (0.62 + 0.22 * Math.sin(t * 4.5 + i * 1.7)), s = R * (0.34 + 0.08 * Math.sin(t * 6 + i));
        const lx = x + Math.cos(a) * rr * 0.75, ly = y + Math.sin(a) * rr * 0.75;
        g = ctx.createRadialGradient(lx, ly, 0, lx, ly, s);
        g.addColorStop(0, 'rgba(255,170,50,0.5)'); g.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, s, 0, TAU); ctx.fill();
    }
    g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.16, 'rgba(255,245,190,0.97)'); g.addColorStop(0.42, 'rgba(255,170,40,0.9)');
    g.addColorStop(0.75, 'rgba(235,70,20,0.78)'); g.addColorStop(1, 'rgba(120,20,5,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
    // flame tongues
    ctx.fillStyle = 'rgba(255,150,40,0.35)';
    for (let i = 0; i < 9; i++) {
        const a = -Math.PI / 2 + (i - 4) * 0.34 + Math.sin(t * 3 + i) * 0.12, len = R * (1.1 + 0.25 * Math.sin(t * 7 + i * 2));
        ctx.beginPath(); ctx.moveTo(x + Math.cos(a - 0.14) * R * 0.85, y + Math.sin(a - 0.14) * R * 0.85);
        ctx.quadraticCurveTo(x + Math.cos(a) * len * 1.05, y + Math.sin(a) * len * 1.05, x + Math.cos(a + 0.14) * R * 0.85, y + Math.sin(a + 0.14) * R * 0.85); ctx.fill();
    }
    ctx.restore();
}
function drawRuneCircle(now) {
    if (!FIN.on || !(FIN.runeA > 0.01)) return;
    const t = now / 1000, a = clamp(FIN.runeA);
    ctx.save(); ctx.translate(green.x, green.gy); ctx.scale(1, 0.24); ctx.globalCompositeOperation = 'lighter';
    const R = 130 * u * (0.7 + 0.3 * a);
    ctx.strokeStyle = `rgba(255,170,70,${0.8 * a})`; ctx.lineWidth = 3 * S * 2; ctx.shadowColor = 'rgba(255,120,30,0.9)'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2 * S * 2; ctx.beginPath(); ctx.arc(0, 0, R * 0.82, 0, TAU); ctx.stroke();
    ctx.rotate(t * 0.6);
    ctx.beginPath(); for (let i = 0; i < 3; i++) { const an = i * TAU / 3; ctx.lineTo(Math.cos(an) * R * 0.82, Math.sin(an) * R * 0.82); } ctx.closePath(); ctx.stroke();
    ctx.rotate(-t * 1.2);
    ctx.beginPath(); for (let i = 0; i < 3; i++) { const an = Math.PI + i * TAU / 3; ctx.lineTo(Math.cos(an) * R * 0.82, Math.sin(an) * R * 0.82); } ctx.closePath(); ctx.stroke();
    for (let i = 0; i < 12; i++) { const an = i * TAU / 12 + t * 0.3; ctx.beginPath(); ctx.moveTo(Math.cos(an) * R * 0.88, Math.sin(an) * R * 0.88); ctx.lineTo(Math.cos(an) * R * 0.97, Math.sin(an) * R * 0.97); ctx.stroke(); }
    ctx.restore();
}
function drawScorch() {
    if (!scorch) return;
    ctx.save(); ctx.translate(scorch.x, scorch.y); ctx.scale(1, 0.22);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 150 * u);
    g.addColorStop(0, 'rgba(10,6,6,0.75)'); g.addColorStop(0.6, 'rgba(10,6,6,0.4)'); g.addColorStop(1, 'rgba(10,6,6,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 150 * u, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter'; const k = Math.max(0, 1 - scorch.t / 6);
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 90 * u); g2.addColorStop(0, `rgba(255,110,30,${0.5 * k})`); g2.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(0, 0, 90 * u, 0, TAU); ctx.fill();
    ctx.restore();
}
function drawVignette() {
    let v = 0;
    if (!boomed) v = prog > 0.45 ? Math.pow((prog - 0.45) / 0.55, 1.4) * 0.3 : 0;
    if (FIN.on) v += FIN.grow * 0.28 + (FIN.runeA || 0) * 0.1;
    if (boomed) v = Math.max(0, 0.3 - boomT * 0.4);
    if (v <= 0.005) return;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.56);
    g.addColorStop(0, 'rgba(255,70,10,0)'); g.addColorStop(1, `rgba(255,70,10,${v})`);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let timeScale = 1, lastT = 0, started = false, beatTempoS = 1;
function tick(dt) {
    remaining = (endWall - nowMs()) / 1000;
    prog = clamp(1 - (endWall - nowMs()) / spanMs);
    // tempo grows with the build
    const tempo = (FIN.on || boomed ? 1 : lerp(0.92, 1.4, EASE.s(prog))) * (FIN.on || boomed ? 1 : (beatTempoS += (beatTempo - beatTempoS) * (1 - Math.exp(-dt * 1.5))));
    if (hitStop > 0) hitStop -= dt;
    const sdt = dt * tempo * (hitStop > 0 ? 0.05 : 1);

    if (!finaleStarted && remaining <= FIN_LEN) startFinale();
    if (finaleStarted && !boomed) finaleUpdate(dt);
    if (!boomed && remaining <= 0) { if (!finaleStarted) startFinale(); boom(); }
    if (boomed) boomT += dt;
    if (!finaleStarted && !leadInStarted && prog > 0.72 && Math.random() < dt * ((prog - 0.72) / 0.28) * 1.1) meteor();
    mimicUpdate(dt); updateDie(dt); updatePatches(dt);

    for (const c of cos) c.tick(sdt);
    cos = cos.filter(c => !c.done);

    // chargeTo tween
    for (const f of [red, green]) {
        if (f.chargeTo) { const d = f.chargeTo; f.charge += (d.v - f.charge) * (1 - Math.exp(-dt / Math.max(0.05, d.d) * 4)); if (Math.abs(f.charge - d.v) < 0.01) f.chargeTo = null; }
    }
    timerLayout(); TL.hit = Math.max(0, TL.hit - dt * 3); hypeCheck();
    red.update(sdt); green.update(sdt); separate();
    for (const p of projectiles) p.update(sdt);
    projectileCollisions();
    updateParticles(dt * (hitStop > 0 ? 0.3 : 1));
    if (AUD.on) auditTick(dt);

    shakeAmt *= Math.exp(-dt * 9); if (shakeAmt < 0.2) shakeAmt = 0;
    if (whiteFlash > 0) whiteFlash = Math.max(0, whiteFlash - dt * (boomed ? 0.9 : 6));
    // ambient embers build with the fight (and vanish with the blast)
    if (!boomed && prog > 0.4 && Math.random() < dt * (prog - 0.4) * 55) embers(1, 0, W);
}
function render(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shakeAmt > 0) ctx.translate(rnd(-1, 1) * shakeAmt, rnd(-1, 1) * shakeAmt);
    drawScorch();
    drawPatches();
    drawRuneCircle(now);
    drawMimic();
    const fs = [red, green].sort((a, b) => b.z - a.z);
    const drawF = f => { f.drawGhosts(); f.draw(); };
    if (FIN.on && FIN.expand > 0) {
        for (const f of fs) drawF(f);      // the fireball engulfs the fighters...
        drawMegaFire(now);
        drawTimer(now);                    // ...but never the timer
    } else {
        for (const f of fs) if (f.z > 0.3) drawF(f);
        drawMegaFire(now);
        drawTimer(now);
        for (const f of fs) if (f.z <= 0.3) drawF(f);
    }
    for (const p of projectiles) p.draw();
    drawDie();
    drawParticles();
    ctx.restore();
    drawVignette();
    if (whiteFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, whiteFlash)})`; ctx.fillRect(0, 0, W, H); }
}
let lastError = '', fpsT = 0, fpsN = 0, fps = 0;
window.addEventListener('error', e => { lastError = String(e.message || e).slice(0, 90); });
const DEBUG = !!qs.get('debug') || CONFIG.debug;
function repairFighters() {       // if anything ever goes non-finite, put the fighters back on the floor instead of losing them
    for (const f of [red, green]) {
        const bad = !isFinite(f.x) || !isFinite(f.air) || !isFinite(f.z) || !isFinite(f.vy) || !isFinite(f.vx) || KEYS.some(k => !isFinite(f.pose[k]));
        if (bad) {
            f.x = W * (f === red ? 0.3 : 0.7); f.air = 0; f.vy = 0; f.vx = 0; f.z = 0; f.goal = null; f.anim = null; f.override = null; f.tumble = false; f.fly = false; f.gs = 1; f.hidden = false; f.onPlat = false;
            f.pose = pz(f.baseP); lastError = 'repaired ' + f.id;
        }
    }
}
function drawDebug() {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = '14px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(6, 6, 520, 92);
    ctx.fillStyle = '#7CFC9A';
    const l = [`canvas ${W}x${H}  fps ${fps}  beat ${window.__beat || '-'}  acts ${red.cls}/${green.cls}`,
        `red x${Math.round(red.x)} air${Math.round(red.air)}  green x${Math.round(green.x)} air${Math.round(green.air)}  vis ${red.visible}/${green.visible}`,
        `remaining ${Math.round(remaining)}s of ${spanSec}s   started ${started}`, `last error: ${lastError || 'none'}`];
    l.forEach((t, i) => ctx.fillText(t, 12, 12 + i * 20)); ctx.restore();
}
function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastT) / 1000)); lastT = ts;
    fpsN++; if (ts - fpsT > 1000) { fps = fpsN; fpsN = 0; fpsT = ts; }
    if (!W || !H) { resize(); return; }
    try { tick(dt); repairFighters(); render(Date.now()); }
    catch (e) { lastError = String(e.message || e).slice(0, 90); canvas.width = canvas.width; try { repairFighters(); } catch (e2) {} }
    if (DEBUG) drawDebug();
}
function boot() {
    resize();
    if (!W || !H) { setTimeout(boot, 200); return; }          // embedded layers can load hidden / zero-sized: wait until there's room to draw
    if (started) return; started = true;
    red.x = W * 0.27; green.x = W * 0.73; red.air = green.air = H;
    spawn(fightLoop());
    lastT = performance.now(); requestAnimationFrame(frame);
}
Promise.race([document.fonts.load('100px "Bebas Neue"'), new Promise(r => setTimeout(r, 1800))]).then(boot, boot);

/* test hooks */
window.__t = {
    red, green, C, FIN, DIE, MIM, AUD, shakeRef: () => shakeAmt, state: () => ({ rem: remaining, leadIn: leadInStarted, boomed, k0: K0, climax: CLIMAX_AT }),
    seek(sec) { for (let i = 0; i < sec * 30; i++) { clockOffset += 1000 / 30; tick(1 / 30); } render(Date.now()); },
    freeze(who, clip, t, extra) { const f = who === 'red' ? red : green; f.frozen = { clip, t, charge: extra && extra.charge }; },
    unfreeze() { red.frozen = green.frozen = null; },
    draw() { render(Date.now()); },
    idle: () => !!window.__forceDone,
    sched() { SPECIAL = null; buildSchedule(); return SPECIAL.map(e => Math.round(e.t) + ':' + e.kind + (e.to ? '>' + e.to.red + '/' + e.to.green : '') + (e.val ? e.val : '')).join('  '); },
    setClass, PLAT, TL, projN: () => projectiles.map(p => p.type + ':' + (p.returning ? 'ret' : 'out') + ':' + Math.round(p.x)).join(','),
    killAll() { for (const c of cos) c.kill(); cos = []; },
    force(n, arg) {
        for (const c of cos) c.kill(); cos = []; settle();
        const M = { d20: d20Moment, mimic: mimicBeat, misty: mistyBeat, surge: surgeBeat, rush: rushBeat, missile: missileBeat, sky: skyDuel, leap: leapBeat, bombard, wave: waveBeat, ledge: ledgeBeat, throw: throwBeat, volley: volleyBeat, juggle: juggleBeat, grapple: grappleBeat, dash: dashBeat, ambush: ambushBeat, wallslam: wallSlamBeat, brawl: () => brawl(8, false), flurry: () => brawl(8, true), spell: spellDuel, chase: chaseBeat, lead: finaleLeadIn, cls: classChange, kick: () => flyKickStrike(red, green) };
        window.__forceDone = false;
        spawn((function* () { yield* M[n](arg); window.__forceDone = true; for (;;) yield wait(1); })());
    },
    boot
};
})();
</script>
