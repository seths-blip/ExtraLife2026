<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay (Visuals Only)</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; font-family: sans-serif; }
    #now-playing {
      position: absolute; top: -160px; left: 35px;
      background: #000000; 
      border-left: 4px solid #CC4D50; 
      box-shadow: 0 8px 20px rgba(74, 21, 24, 0.7); 
      display: flex; align-items: center; padding: 12px 20px;
      border-radius: 8px;
      transition: top 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      width: 320px;
    }
    #now-playing.show { top: 35px; }
    #art { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; margin-right: 14px; }
    .info { overflow: hidden; display: flex; flex-direction: column; }
    .title { color: #F2D18E; font-weight: bold; font-size: 15px; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { color: #E99C6D; font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <div id="now-playing">
    <img id="art" src="">
    <div class="info">
      <p class="title" id="title"></p>
      <p class="artist" id="artist"></p>
    </div>
  </div>

  <script>
    const CHANNEL_ID = "seth_modsquad_2026_extralife"; // Must match controller
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    
    let displayTimerDuration = 8000;
    let timerRef = null;

    client.on('connect', () => {
      client.subscribe(`${CHANNEL_ID}/command`);
    });

    client.on('message', (topic, message) => {
      const data = JSON.parse(message.toString());
      
      if (data.action === "PLAY" || data.action === "SYNC_VISUALS") {
        document.getElementById('title').innerText = data.track.title;
        document.getElementById('artist').innerText = data.track.artist;
        document.getElementById('art').src = data.track.cover_url;
        showBanner();
      } 
      else if (data.action === "SET_TIMER") {
        displayTimerDuration = data.seconds * 1000;
      }
      else if (data.action === "TRIGGER_BANNER") {
        showBanner();
      }
    });

    function showBanner() {
      const card = document.getElementById('now-playing');
      card.classList.add('show');
      clearTimeout(timerRef);
      if (displayTimerDuration > 0) {
        timerRef = setTimeout(() => card.classList.remove('show'), displayTimerDuration);
      }
    }
  </script>
</body>
</html>
