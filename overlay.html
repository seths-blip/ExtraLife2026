<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root { --ticker-speed: 35s; }
    body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; color: #FFF; background: transparent; width: 1920px; height: 1080px; }
    
    .widget { position: absolute; transition: all 0.5s ease; box-sizing: border-box; }
    iframe.widget { background: transparent !important; border: none; overflow: hidden; }
    
    #countdown-widget { background: rgba(0,0,0,0.85); border: 4px solid #D4AF37; padding: 20px; text-align: center; border-radius: 10px; display: none; z-index: 100; }
    .cd-label { font-size: 24px; color: #D4AF37; } 
    #cd-time { font-size: 48px; }

    #np-wrapper { z-index: 150; pointer-events: none; }
    #now-playing-widget {
      opacity: 0; pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0,0,0,0.85); border: 4px solid #D4AF37; border-radius: 10px;
      display: flex; align-items: center; padding: 15px 25px; gap: 20px;
      transform: translateY(-50px) scale(0.9);
    }
    #now-playing-widget.active { opacity: 1; transform: translateY(0) scale(1); }
    .np-art { width: 80px; height: 80px; border-radius: 5px; object-fit: cover; border: 2px solid #55FF55; background: #000; }
    .np-info { display: flex; flex-direction: column; white-space: nowrap; }
    .np-title { font-size: 36px; font-weight: bold; color: #55FF55; margin-bottom: -5px; }
    .np-artist { font-size: 24px; color: #D4AF37; }

    #ticker-wrap { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background-color: rgba(0, 0, 0, 0.85); border-top: 4px solid #D4AF37; border-bottom: 4px solid #D4AF37; display: flex; align-items: center; font-size: 28px; text-transform: uppercase; text-shadow: 2px 2px #000; overflow: hidden; white-space: nowrap; z-index: 1000; }
    .ticker-track { display: flex; animation: seamless-ticker var(--ticker-speed) linear infinite; }
    @keyframes seamless-ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .ticker-item { display: flex; align-items: center; padding-right: 50px; }
    .fight-canvas { margin-left: 60px; margin-right: 60px; }
    
    #progress-bar-bg { position: absolute; bottom: 54px; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.5); z-index: 1001; display: none; }
    #progress-bar-fill { width: 0%; height: 100%; background: #55FF55; box-shadow: 0 0 10px #55FF55; transition: width 2s ease-in-out; }

    #alert-wrapper { position: absolute; z-index: 9999; transition: all 0.5s ease; width: max-content; height: max-content; }
    #alert-box { display: none; background-color: #8B0000; border: 4px solid #D4AF37; padding: 15px 30px; font-size: 36px; text-align: center; text-shadow: 2px 2px #000; box-shadow: 0px 0px 15px #D4AF37; animation: popup 0.5s ease-out; white-space: nowrap; }
    @keyframes popup { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    
    #confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; overflow: hidden; }
    .confetti-piece { position: absolute; font-size: 30px; animation: fall 3s linear forwards; }
    @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(1100px) rotate(720deg); opacity: 0; } }
    .gold-text { color: #D4AF37; } .green-text { color: #55FF55; }
  </style>
</head>
<body>
  
  <iframe id="band-effects" class="widget" src="about:blank" allowtransparency="true" style="display:none; z-index: 55;"></iframe>
  <iframe id="dice-of-doom" class="widget" src="about:blank" allowtransparency="true" style="display:none; z-index: 60;"></iframe>

  <div id="countdown-widget" class="widget">
    <div class="cd-label">EXTRA LIFE MARATHON</div>
    <span id="cd-time">00:00:00</span>
  </div>
  
  <div id="np-wrapper" class="widget">
    <div id="now-playing-widget">
      <img id="np-art" class="np-art" src="./stream-player/images/image_ef100c.png" alt="Album Art" onerror="if(!this.failed){this.failed=true; this.src='./stream-player/images/image_ef100c.png';} else {this.onerror=null; this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';}">
      <div class="np-info">
        <span class="np-title" id="np-title">Track</span>
        <span class="np-artist" id="np-artist">Artist</span>
      </div>
    </div>
  </div>

  <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  <div id="alert-wrapper"><div id="alert-box"><span>⚔️ CRITICAL HIT! ⚔️</span><br><span id="alert-text" class="gold-text"></span></div></div>

  <div id="ticker-wrap">
    <div class="ticker-track" id="main-ticker-track">
      <div class="ticker-item"><span id="ticker-text-1">Loading Guild Data...</span><canvas id="fight-canvas-1" class="fight-canvas" width="300" height="40"></canvas></div>
      <div class="ticker-item"><span id="ticker-text-2">Loading Guild Data...</span><canvas id="fight-canvas-2" class="fight-canvas" width="300" height="40"></canvas></div>
    </div>
  </div>

  <div id="confetti-container"></div>

  <script>
    const teamID = "74089"; 
    let targetDate = new Date().getTime() + (24 * 60 * 60 * 1000); 
    let stagedTicker = { pending: false, active: false, text: "", loops: 0, pendingText: "", pendingLoops: 0 };
    let soundsEnabled = true, visualEffectsEnabled = true;
    let npTimeout;

    function applyPosition(el, pos, width, height) {
      if (!pos) pos = 'top-left'; 
      el.style.top = ''; el.style.bottom = ''; el.style.left = ''; el.style.right = ''; 
      
      let transformStr = 'translate(0, 0)';

      if(width) el.style.width = width + (typeof width === 'number' ? 'px' : ''); 
      if(height) el.style.height = height + (typeof height === 'number' ? 'px' : '');
      
      let originY = pos.includes('top') ? 'top' : (pos.includes('bottom') ? 'bottom' : 'center');
      let originX = pos.includes('left') ? 'left' : (pos.includes('right') ? 'right' : 'center');
      el.style.transformOrigin = `${originY} ${originX}`;

      if (width == 1920 && height == 1080) {
        el.style.top = '0px';
        el.style.left = '0px';
        el.style.transform = 'none';
        return; 
      }

      switch(pos) {
        case 'top-left': el.style.top = '50px'; el.style.left = '50px'; break;
        case 'top-right': el.style.top = '50px'; el.style.right = '50px'; break;
        case 'top-center': el.style.top = '50px'; el.style.left = '50%'; transformStr = 'translateX(-50%)'; break;
        case 'bottom-left': el.style.bottom = '80px'; el.style.left = '50px'; break; 
        case 'bottom-right': el.style.bottom = '80px'; el.style.right = '50px'; break;
        case 'bottom-center': el.style.bottom = '80px'; el.style.left = '50%'; transformStr = 'translateX(-50%)'; break;
        case 'center': el.style.top = '50%'; el.style.left = '50%'; transformStr = 'translate(-50%, -50%)'; break;
      }
      
      el.style.transform = transformStr;
    }

    function applyConfig(config) {
      if (!config) return;
      try { localStorage.setItem('extralife_overlay_cache', JSON.stringify(config)); } catch(e) {}

      const clock = document.getElementById('countdown-widget'); 
      clock.style.display = config.clock.show ? 'block' : 'none'; 
      applyPosition(clock, config.clock.pos); 
      clock.style.transform += ` scale(${config.clock.scale})`; 
      
      const updateIframe = (id, data) => { 
        const el = document.getElementById(id);
        if (!el) return;
        
        if (data && data.show && data.url && data.url.trim() !== "") {
          el.style.display = 'block';
          applyPosition(el, data.pos, data.width, data.height);
          if (el.getAttribute('src') !== data.url) {
            el.setAttribute('src', data.url);
          }
        } else {
          el.style.display = 'none';
          if (el.getAttribute('src') !== 'about:blank') {
            el.setAttribute('src', 'about:blank');
          }
        }
      };
      
      updateIframe('band-effects', config.bandEffects);
      updateIframe('dice-of-doom', config.diceOfDoom);

      document.getElementById('ticker-wrap').style.display = config.ticker.show ? 'flex' : 'none'; 
      document.getElementById('progress-bar-bg').style.display = config.ticker.showProgressBar ? 'block' : 'none';
      
      applyPosition(document.getElementById('alert-wrapper'), config.alerts.pos);
      soundsEnabled = config.effects.sound; 
      visualEffectsEnabled = config.effects.visual; 
      if (config.targetTime) targetDate = parseInt(config.targetTime);
      
      fetchExtraLifeData(); 
    }

    window.addEventListener('load', () => {
      let configApplied = false;
      try {
        const cached = localStorage.getItem('extralife_overlay_cache');
        if (cached) {
          applyConfig(JSON.parse(cached));
          configApplied = true;
        }
      } catch(e) {}
      
      if (!configApplied) {
        applyConfig({
          clock: { show: true, pos: 'top-right', scale: 1 },
          ticker: { show: true, showProgressBar: true },
          alerts: { pos: 'center' },
          effects: { sound: true, visual: true },
          bandEffects: { show: false }, diceOfDoom: { show: false }
        });
      }
    });

    const topicName = `extralife2026/${teamID}/commands`;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt'); 
    
    client.on('connect', () => { 
      client.subscribe(topicName); 
      client.publish(topicName, JSON.stringify({ type: 'request_sync' })); 
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === 'config') applyConfig(data.payload);
        if (data.type === 'alert') donationQueue.push(data.payload);
        if (data.type === 'confetti') fireConfetti();
        if (data.type === 'stage_ticker') {
          stagedTicker.pendingText = data.payload.text; 
          stagedTicker.pendingLoops = data.payload.loops; 
          stagedTicker.pending = true;
        }
        if (data.type === 'now_playing') {
          const npWrapper = document.getElementById('np-wrapper');
          const np = document.getElementById('now-playing-widget');
          document.getElementById('np-title').innerText = data.payload.title || "Track";
          document.getElementById('np-artist').innerText = data.payload.artist || "Artist";
          
          const artImg = document.getElementById('np-art');
          artImg.failed = false; 
          artImg.src = data.payload.art || "./stream-player/images/image_ef100c.png";
          
          applyPosition(npWrapper, data.payload.pos);
          
          np.classList.add('active');
          clearTimeout(npTimeout);
          npTimeout = setTimeout(() => np.classList.remove('active'), 12000);
        }
        if (data.type === 'dice_roll') {
          const diceFrame = document.getElementById('dice-of-doom');
          if (diceFrame && diceFrame.contentWindow) diceFrame.contentWindow.postMessage('ROLL_DICE', '*');
        }
      } catch(e) {}
    });

    document.getElementById('main-ticker-track').addEventListener('animationiteration', () => {
      if (stagedTicker.pending) {
        stagedTicker.active = true; 
        stagedTicker.text = stagedTicker.pendingText; 
        stagedTicker.loops = stagedTicker.pendingLoops; 
        stagedTicker.pending = false;
      } else if (stagedTicker.active) {
        stagedTicker.loops--; 
        if (stagedTicker.loops <= 0) { 
          stagedTicker.active = false; 
          stagedTicker.text = ""; 
        }
      }
      fetchExtraLifeData(); 
    });

    let globalAudioCtx = null;

    function fireConfetti() {
      const container = document.getElementById('confetti-container'); 
      const emojis = ['🎉', '💸', '✨', '🪙', '🎮', '⚔️'];
      for (let i = 0; i < 50; i++) { 
        let el = document.createElement('div'); 
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)]; 
        el.className = 'confetti-piece'; 
        el.style.left = Math.random() * 100 + 'vw'; 
        el.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
        el.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
        container.appendChild(el); 
        setTimeout(() => el.remove(), 5000); 
      }
      
      if (soundsEnabled) { 
        try { 
          if (!globalAudioCtx) {
            globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          const osc = globalAudioCtx.createOscillator();
          const g = globalAudioCtx.createGain();
          osc.type = 'triangle';
          osc.connect(g);
          g.connect(globalAudioCtx.destination);
          
          const now = globalAudioCtx.currentTime;
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.5);
          g.gain.setValueAtTime(0.2, now);
          g.gain.exponentialRampToValueAtTime(0.00001, now + 1);
          
          osc.start(now);
          osc.stop(now + 1); 
        } catch(e) {} 
      }
    }

    setInterval(() => {
      let now = new Date().getTime(), distance = targetDate - now, isOvertime = distance < 0, absDist = Math.abs(distance);
      let d = Math.floor(absDist / (1000 * 60 * 60 * 24));
      let h = Math.floor((absDist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      let m = Math.floor((absDist % (1000 * 60 * 60)) / (1000 * 60));
      let s = Math.floor((absDist % (1000 * 60)) / 1000);
      let tStr = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      if (d > 0) tStr = d + ":" + tStr; 
      document.getElementById("cd-time").innerHTML = isOvertime ? "+" + tStr : tStr;
      const cdLabel = document.querySelector('.cd-label'); 
      cdLabel.innerText = isOvertime ? "MARATHON OVERTIME" : "EXTRA LIFE MARATHON"; 
      cdLabel.style.color = isOvertime ? "#FF5555" : "#D4AF37";
    }, 1000);

    let seenDonationIDs = [], donationQueue = [], isAlerting = false, isFirstLoad = true;
    
    async function fetchExtraLifeData() { 
      try { 
        // 1. Double API Check to protect against Team vs Participant ID mixups
        let apiURL = `https://extralife.donordrive.com/api/teams/${teamID}`;
        let tRes = await fetch(apiURL);
        
        if(!tRes.ok) {
          apiURL = `https://extralife.donordrive.com/api/participants/${teamID}`;
          tRes = await fetch(apiURL);
        }

        if(!tRes.ok) {
          let errStr = `🚨 API ERROR: EXTRA LIFE ID ${teamID} IS OFFLINE OR RESTRICTED 🚨 &nbsp;&nbsp;&nbsp;`;
          document.getElementById('ticker-text-1').innerHTML = errStr;
          document.getElementById('ticker-text-2').innerHTML = errStr;
          return;
        }

        const tData = await tRes.json(); 
        
        // 2. Fetch donations associated with whichever API worked
        let dons = [];
        const dRes = await fetch(`${apiURL}/donations`); 
        if(dRes.ok) {
          const dData = await dRes.json();
          if (Array.isArray(dData)) dons = dData;
        }
        
        let raised = tData.sumDonations || 0; 
        let goal = tData.fundraisingGoal || 1; 
        document.getElementById('progress-bar-fill').style.width = Math.min((raised / goal) * 100, 100) + '%'; 
        
        let str = ""; 
        if (stagedTicker.active && stagedTicker.text.trim() !== "") { 
          str += `📢 <span class="green-text">${stagedTicker.text.toUpperCase()}</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; `; 
        }
        
        let guildName = tData.name || tData.displayName || "Our Guild";
        str += `👑 <span class="gold-text">${guildName.toUpperCase()} PROGRESS:</span> $${raised} / $${goal} 👑 &nbsp;&nbsp;&nbsp;&nbsp; 📜 <span class="gold-text">BENEFACTORS:</span> `; 
        
        if (dons.length > 0) {
          dons.slice(0,5).forEach(d => str += `${d.displayName||"Hero"} ($${d.amount}) • `); 
        } else {
          str += `Awaiting our first hero! • `;
        }
        
        document.getElementById('ticker-text-1').innerHTML = str; 
        document.getElementById('ticker-text-2').innerHTML = str; 
        
        for(let i=dons.length-1; i>=0; i--){ 
          if(!seenDonationIDs.includes(dons[i].donationID)){ 
            seenDonationIDs.push(dons[i].donationID); 
            if(!isFirstLoad) donationQueue.push({name:dons[i].displayName||"Hero", amount:dons[i].amount}); 
          } 
        } 
        isFirstLoad = false; 
      } catch(err){} 
    }
    
    function processQueue() { 
      if(isAlerting || donationQueue.length === 0) return; 
      isAlerting = true; 
      let cur = donationQueue.shift(); 
      document.getElementById('alert-text').innerHTML = `${cur.name} gifted <span class="green-text">$${cur.amount}</span>!`; 
      document.getElementById('alert-box').style.display = 'block'; 
      setTimeout(() => {
        document.getElementById('alert-box').style.display = 'none'; 
        setTimeout(() => isAlerting = false, 2000);
      }, 8000); 
    }
    
    setInterval(fetchExtraLifeData, 30000); 
    fetchExtraLifeData(); 
    setInterval(processQueue, 1000);

    const ctx1 = document.getElementById('fight-canvas-1').getContext('2d');
    const ctx2 = document.getElementById('fight-canvas-2').getContext('2d');
    const ARC_DATA = [ { trap: 'mimic', tColor: 'white', boss: 'slime', bColor: 'rgba(0, 255, 100, 0.8)', eColor: 'black' }, { trap: 'bomb', tColor: 'orange', boss: 'eye', bColor: 'white', eColor: 'blue' }, { trap: 'ghost', tColor: 'rgba(200, 200, 255, 0.8)', boss: 'specter', bColor: 'rgba(200, 200, 255, 0.8)', eColor: 'black' }, { trap: 'snake', tColor: 'green', boss: 'spider', bColor: '#333', eColor: '#FF5555' }, { trap: 'swarm', tColor: 'black', boss: 'golem', bColor: '#777', eColor: 'cyan' }, { trap: 'elemental', tColor: 'red', boss: 'dragon', bColor: '#A00', eColor: 'yellow' }, { trap: 'elemental', tColor: 'purple', boss: 'slime', bColor: 'rgba(150, 0, 200, 0.8)', eColor: 'lime' }, { trap: 'elemental', tColor: 'cyan', boss: 'golem', bColor: '#AADDFF', eColor: 'blue' }, { trap: 'projectile', tColor: 'red', boss: 'eye', bColor: '#555', eColor: 'red' }, { trap: 'snake', tColor: 'purple', boss: 'spider', bColor: 'purple', eColor: 'pink' }, { trap: 'swarm', tColor: '#EDC9AF', boss: 'dragon', bColor: '#EDC9AF', eColor: 'orange' }, { trap: 'elemental', tColor: 'yellow', boss: 'specter', bColor: 'rgba(255, 255, 100, 0.8)', eColor: 'white' }, { trap: 'mimic', tColor: 'red', boss: 'spider', bColor: 'white', eColor: 'red' }, { trap: 'ghost', tColor: 'rgba(255, 50, 50, 0.8)', boss: 'specter', bColor: 'rgba(255, 50, 50, 0.8)', eColor: 'yellow' }, { trap: 'projectile', tColor: 'magenta', boss: 'golem', bColor: 'magenta', eColor: 'white' }, { trap: 'bomb', tColor: 'purple', boss: 'eye', bColor: 'black', eColor: 'purple' }, { trap: 'elemental', tColor: 'lime', boss: 'dragon', bColor: 'lime', eColor: 'green' }, { trap: 'projectile', tColor: 'silver', boss: 'golem', bColor: '#444', eColor: 'red' }, { trap: 'mimic', tColor: 'black', boss: 'slime', bColor: 'rgba(255, 50, 0, 0.8)', eColor: 'yellow' }, { trap: 'elemental', tColor: 'cyan', boss: 'dragon', bColor: 'cyan', eColor: 'white' }, { trap: 'swarm', tColor: 'white', boss: 'spider', bColor: '#DDD', eColor: 'black' }, { trap: 'bomb', tColor: 'gray', boss: 'slime', bColor: 'rgba(139, 69, 19, 0.8)', eColor: 'black' }, { trap: 'swarm', tColor: '#222', boss: 'specter', bColor: 'rgba(50, 50, 50, 0.8)', eColor: 'red' }, { trap: 'elemental', tColor: 'gold', boss: 'dragon', bColor: '#FFD700', eColor: 'white' } ];
    let frameCount = 0, storyChapter = 0, currentArc = 0, fightRoutine = 1, arcBag = [];
    let leftX = 50, leftY = 28, leftState = 'idle', rightX = 250, rightY = 28, rightState = 'idle';

    function getNextRandomArc() { 
        try { let stored = localStorage.getItem("extralife_arc_bag"); if (stored) arcBag = JSON.parse(stored); } catch(e) {} 
        if (!arcBag || arcBag.length === 0) { 
            arcBag = Array.from({length: 24}, (_, i) => i); 
            for (let i = arcBag.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [arcBag[i], arcBag[j]] = [arcBag[j], arcBag[i]]; 
            } 
        } 
        let nextArc = arcBag.pop(); 
        try { localStorage.setItem("extralife_arc_bag", JSON.stringify(arcBag)); } catch(e) {} 
        return nextArc; 
    }
    
    currentArc = getNextRandomArc();

    function drawMiniFighter(ctx, x, y, direction, state, color) {
      ctx.save(); ctx.translate(x, y); ctx.scale(direction, 1); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; let headY = -20, bodyY = -16;
      if (state === 'duck') { headY += 8; bodyY += 8; } else if (state === 'sit') { headY += 12; bodyY += 12; } else if (state === 'cheer') { headY -= 4; bodyY -= 4; }
      ctx.beginPath(); ctx.arc(0, headY, 4, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY); ctx.lineTo(0, 0); ctx.stroke();
      if (state === 'idle' || state === 'cheer') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, 12); ctx.stroke();
        if (state === 'cheer') { ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(-8, bodyY-4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(8, bodyY-4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8, bodyY-4); ctx.lineTo(12, -20); ctx.stroke(); } 
        else { ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(-6, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(6, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, bodyY+12); ctx.lineTo(14, bodyY+4); ctx.stroke(); }
      } 
      else if (state === 'step') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6, 10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, 10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(-4, bodyY+14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(8, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8, bodyY+12); ctx.lineTo(16, bodyY+6); ctx.stroke(); } 
      else if (state === 'attack') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(-6, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(12, bodyY+6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(12, bodyY+6); ctx.lineTo(22, bodyY+14); ctx.stroke(); } 
      else if (state === 'block') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(10, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(10, bodyY+12); ctx.lineTo(10, bodyY-6); ctx.stroke(); }
      else if (state === 'duck') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, 8); ctx.lineTo(-4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8, 8); ctx.lineTo(4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(8, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8, bodyY+12); ctx.lineTo(16, bodyY+12); ctx.stroke(); }
      else if (state === 'kick') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, -2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(-6, bodyY+12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(10, bodyY+6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(10, bodyY+6); ctx.lineTo(16, bodyY-4); ctx.stroke(); }
      else if (state === 'sit') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, 0); ctx.lineTo(10, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, bodyY+4); ctx.lineTo(14, bodyY+8); ctx.stroke(); ctx.beginPath(); ctx.moveTo(14, bodyY+8); ctx.lineTo(24, bodyY+8); ctx.stroke(); ctx.fillStyle = "white"; ctx.fillRect(20, bodyY+5, 6, 6); }
      ctx.restore();
    }

    function drawScenery(ctx, frame, arc, ch) {
      if(ch===2||ch===3) {
         ctx.fillStyle = "#8B4513"; ctx.fillRect(140, 16, 20, 12); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 12, 20, 6); ctx.fillStyle = "#FFD700"; ctx.fillRect(148, 14, 4, 4);
         if(ch===2 && frame>120){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.fillStyle = "#00FFFF"; ctx.beginPath(); ctx.arc(150, 18, 4, 0, Math.PI*2); ctx.fill(); }
         if(ch===3 && frame>100) {
            let t = ARC_DATA[arc].trap, c = ARC_DATA[arc].tColor;
            if(t==='mimic'){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 20, 6); ctx.fillStyle = c; for(let i=0; i<4; i++) { ctx.beginPath(); ctx.moveTo(142+i*5, 8); ctx.lineTo(144+i*5, 12); ctx.lineTo(147+i*5, 8); ctx.fill(); ctx.beginPath(); ctx.moveTo(142+i*5, 16); ctx.lineTo(144+i*5, 12); ctx.lineTo(147+i*5, 16); ctx.fill(); } if(frame>160){ ctx.clearRect(140,2,20,10); ctx.fillRect(140,12,20,6); } }
            else if(t==='bomb'){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); if(frame<140){ctx.fillStyle="#222";ctx.beginPath();ctx.arc(150,16,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle="white";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(150,10);ctx.lineTo(155,4);ctx.stroke();if(frame%4<2){ctx.fillStyle="yellow";ctx.fillRect(154,2,3,3);}}else if(frame<160){ctx.fillStyle=c;ctx.beginPath();ctx.arc(150,16,20,0,Math.PI*2);ctx.fill();ctx.fillStyle="yellow";ctx.beginPath();ctx.arc(150,16,10,0,Math.PI*2);ctx.fill();} }
            else if(t==='ghost'){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.fillStyle=c; ctx.beginPath(); ctx.arc(150, 18-(frame-100)*0.5, 6, Math.PI, 0); ctx.fill(); }
            else if(t==='snake'){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.strokeStyle=c; ctx.lineWidth=3; let s=Math.min(10,(frame-100)*0.5); ctx.beginPath(); ctx.moveTo(150,18); ctx.lineTo(150,18-s); ctx.stroke(); ctx.fillStyle="red"; ctx.fillRect(149,16-s,2,2); }
            else if(t==='swarm'&&frame<160){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.fillStyle=c; let s=(frame-100)*0.5; ctx.fillRect(150-s,18-s,4,2); ctx.fillRect(150+s,18-s,4,2); ctx.fillRect(150,18-s*1.2,4,2); }
            else if(t==='elemental'&&frame<160){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.fillStyle=(frame%4<2)?c:"white"; ctx.beginPath(); ctx.arc(150,12,8,0,Math.PI*2); ctx.fill(); }
            else if(t==='projectile'&&frame<160){ ctx.clearRect(140, 12, 20, 6); ctx.fillStyle = "#D2B48C"; ctx.fillRect(140, 2, 6, 14); ctx.fillStyle=c; ctx.fillRect(140-(frame-100)*2, 14, 12, 4); }
         }
      }
      else if(ch===4) { ctx.fillStyle = "#5c4033"; ctx.fillRect(145, 26, 10, 4); ctx.fillStyle = (frame % 10 < 5) ? "#FF4500" : "#FF8C00"; ctx.beginPath(); ctx.moveTo(150, 12); ctx.lineTo(144, 26); ctx.lineTo(156, 26); ctx.fill(); }
      else if(ch===5 && frame<=150) {
         let b = ARC_DATA[arc].boss, bc = ARC_DATA[arc].bColor, ec = ARC_DATA[arc].eColor, br = Math.sin(frame*0.1)*2, s = (frame>140)?25-(frame-140)*2:25;
         if(b==='slime'){ ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(150,28,s+br,Math.PI,0); ctx.fill(); if(frame<=140){ctx.fillStyle="white";ctx.fillRect(138,14-br,6,6);ctx.fillRect(156,14-br,6,6);ctx.fillStyle=ec;ctx.fillRect(140,16-br,2,2);ctx.fillRect(158,16-br,2,2);} }
         else if(b==='eye'){ ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(150,16+br,s*0.8,0,Math.PI*2); ctx.fill(); if(frame<=140){ctx.fillStyle=ec;ctx.beginPath();ctx.arc(150,16+br,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="black";ctx.beginPath();ctx.arc(150,16+br,4,0,Math.PI*2);ctx.fill();} }
         else if(b==='specter'){ ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(150,12+br,s*0.7,Math.PI,0); ctx.lineTo(150+s*0.7,30); ctx.lineTo(140,25); ctx.lineTo(150-s*0.7,30); ctx.fill(); if(frame<=140){ctx.fillStyle=ec;ctx.fillRect(142,10+br,4,6);ctx.fillRect(154,10+br,4,6);} }
         else if(b==='spider'){ ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(150,22+br,s*0.6,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=bc; ctx.lineWidth=2; let lm=Math.sin(frame*0.5)*4; ctx.beginPath(); ctx.moveTo(150,22); ctx.lineTo(130,15+lm); ctx.lineTo(120,28); ctx.stroke(); ctx.beginPath(); ctx.moveTo(150,22); ctx.lineTo(170,15-lm); ctx.lineTo(180,28); ctx.stroke(); if(frame<=140){ctx.fillStyle=ec;ctx.fillRect(146,20+br,2,2);ctx.fillRect(152,20+br,2,2);} }
         else if(b==='golem'){ ctx.fillStyle=bc; ctx.fillRect(140,10+br,20,18); ctx.fillRect(144,2+br,12,8); if(frame<=140){ctx.fillStyle=ec;ctx.fillRect(146,4+br,3,2);ctx.fillRect(151,4+br,3,2);} }
         else if(b==='dragon'){ ctx.fillStyle=bc; ctx.beginPath(); ctx.moveTo(135,28); ctx.lineTo(150,5+br); ctx.lineTo(165,28); ctx.fill(); if(frame<=140){ctx.fillStyle=ec;ctx.fillRect(145,15+br,3,3);ctx.fillRect(152,15+br,3,3);if(frame%20<10){ctx.fillStyle=ec;ctx.beginPath();ctx.arc(150,25+br,6,0,Math.PI*2);ctx.fill();}} }
      }
      else if(ch===6) { ctx.fillStyle = "#FFD700"; ctx.fillRect(145, 15, 10, 15); ctx.beginPath(); ctx.arc(150, 10, 12, 0, Math.PI, true); ctx.fill(); ctx.fillRect(140, 28, 20, 4); }
    }

    function animateFight() {
      let cycle = frameCount % 240; 
      if (cycle === 0) {
        storyChapter++;
        if (storyChapter > 6) { storyChapter = 1; currentArc = getNextRandomArc(); }
        if (storyChapter === 1) fightRoutine = Math.floor(Math.random() * 6) + 1;
      }
      leftY = 28; rightY = 28; leftState = 'idle'; rightState = 'idle'; let lStart = 50, rStart = 250, cLeft = 135, cRight = 165;

      if (storyChapter === 1) { 
        if (cycle < 60) { let t = cycle / 60; leftX = lStart + (cLeft - lStart)*t; rightX = rStart + (cRight - rStart)*t; leftState = (frameCount % 10 < 5) ? 'step' : 'idle'; rightState = (frameCount % 10 < 5) ? 'step' : 'idle'; } 
        else if (cycle < 180) { 
          leftX = cLeft; rightX = cRight; 
          if (fightRoutine === 1) { if(cycle<100){leftState='attack';rightState='block';}else if(cycle<140){leftState='block';rightState='attack';}else{leftState='attack';rightState='block';} }
          else if (fightRoutine === 2) { leftState='attack'; rightState='attack'; leftX=cLeft-5; rightX=cRight+5; } 
          else if (fightRoutine === 3) { if(cycle<100){leftState='attack';rightState='duck';}else if(cycle<140){leftState='idle';leftY=12;rightState='attack';}else{leftState='attack';rightState='duck';} } 
          else if (fightRoutine === 4) { if(cycle<100){leftState='duck';rightState='attack';leftX=cLeft-10;rightX=cRight-10;}else if(cycle<140){leftState='block';rightState='attack';leftX=cLeft-5;rightX=cRight-5;}else{leftState='attack';rightState='block';} } 
          else if (fightRoutine === 5) { if(cycle<90){leftState='step';rightState='step';leftY=28-(cycle-60);rightY=28-(cycle-60);}else if(cycle<120){leftState='attack';rightState='attack';leftY=-2;rightY=-2;}else if(cycle<140){leftY=28;rightY=28;leftX=cLeft-10;rightX=cRight+10;}else{leftState='block';rightState='block';} } 
          else if (fightRoutine === 6) { if(cycle<90){leftState='kick';rightState='block';}else if(cycle<130){rightX=cRight+(cycle-90);}else if(cycle<160){leftState='block';rightState='step';rightX=cRight+40-(cycle-130)*1.5;}else{leftState='attack';rightState='block';} } 
        } 
        else { let t = (cycle - 180) / 60; leftX = cLeft - (cLeft - lStart)*t; rightX = cRight - (cRight - rStart)*t; leftState = 'step'; rightState = 'step'; }
      }
      else if (storyChapter >= 2 && storyChapter <= 6) {
        if (cycle < 60) { let t = cycle / 60; leftX = lStart + (110 - lStart)*t; rightX = rStart + (190 - rStart)*t; leftState = (frameCount % 10 < 5) ? 'step' : 'idle'; rightState = (frameCount % 10 < 5) ? 'step' : 'idle'; } 
        else if (cycle < 180) { 
           leftX = 110; rightX = 190; 
           if(storyChapter===2 || storyChapter===3) { if(cycle<120||storyChapter===3&&cycle<160){leftState='attack';rightState='attack';} else {leftState=(cycle%20<10)?'cheer':'idle';rightState=(cycle%20<10)?'cheer':'idle';} }
           else if(storyChapter===4) { leftState='sit'; rightState='sit'; leftX=125; rightX=175; }
           else if(storyChapter===5) { if(cycle<150){leftState=(cycle%10<5)?'attack':'idle';rightState=(cycle%10<5)?'attack':'idle';}else{leftState=(cycle%20<10)?'cheer':'idle';leftY=(cycle%20<10)?20:28;rightState=(cycle%20<10)?'cheer':'idle';rightY=(cycle%20<10)?20:28;} }
           else if(storyChapter===6) { leftState='cheer';leftY=(cycle%20<10)?20:28;rightState='cheer';rightY=(cycle%20<10)?20:28;leftX=120;rightX=180; }
        } 
        else { let t = (cycle - 180) / 60; leftX = (storyChapter===4||storyChapter===6?120:110) - ((storyChapter===4||storyChapter===6?120:110) - lStart)*t; rightX = (storyChapter===4||storyChapter===6?180:190) - ((storyChapter===4||storyChapter===6?180:190) - rStart)*t; leftState = 'step'; rightState = 'step'; }
      }

      ctx1.clearRect(0,0,300,40); ctx2.clearRect(0,0,300,40);
      drawScenery(ctx1, cycle, currentArc, storyChapter); drawScenery(ctx2, cycle, currentArc, storyChapter);
      drawMiniFighter(ctx1, rightX, rightY, -1, rightState, '#FF5555'); drawMiniFighter(ctx1, leftX, leftY, 1, leftState, '#55FF55');
      drawMiniFighter(ctx2, rightX, rightY, -1, rightState, '#FF5555'); drawMiniFighter(ctx2, leftX, leftY, 1, leftState, '#55FF55');
      
      if(visualEffectsEnabled) {
         if(storyChapter===1&&((cycle>100&&cycle<105)||(cycle>140&&cycle<145))){ctx1.strokeStyle="#FF0";ctx1.lineWidth=1.5;ctx1.beginPath();ctx1.moveTo(150,26);ctx1.lineTo(155,20);ctx1.stroke();ctx2.strokeStyle="#FF0";ctx2.lineWidth=1.5;ctx2.beginPath();ctx2.moveTo(150,26);ctx2.lineTo(155,20);ctx2.stroke();}
         if(storyChapter===2&&cycle>60&&cycle<120&&cycle%10<5){ctx1.strokeStyle="#FF0";ctx1.lineWidth=1.5;ctx1.beginPath();ctx1.moveTo(145,16);ctx1.lineTo(135,10);ctx1.stroke();ctx2.strokeStyle="#FF0";ctx2.lineWidth=1.5;ctx2.beginPath();ctx2.moveTo(145,16);ctx2.lineTo(135,10);ctx2.stroke();}
         if((storyChapter===3||storyChapter===5)&&cycle>60&&cycle<150&&cycle%10<5){ctx1.strokeStyle="#FF0";ctx1.lineWidth=2;ctx1.beginPath();ctx1.arc(150,15,Math.random()*15+5,0,Math.PI*2);ctx1.stroke();ctx2.strokeStyle="#FF0";ctx2.lineWidth=2;ctx2.beginPath();ctx2.arc(150,15,Math.random()*15+5,0,Math.PI*2);ctx2.stroke();}
      }
      frameCount++; requestAnimationFrame(animateFight);
    }
    
    animateFight();
  </script>
</body>
