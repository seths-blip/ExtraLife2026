<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root { --ticker-speed: 35s; }
    body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; color: #FFF; background: transparent; width: 1920px; height: 1080px; }
    
    .widget { position: absolute; transition: all 0.5s ease; box-sizing: border-box; }
    iframe.widget { background: transparent !important; border: none; overflow: hidden; }
    
    #countdown-widget { background: rgba(0,0,0,0.85); border: 4px solid #D4AF37; padding: 20px; text-align: center; border-radius: 10px; display: none; z-index: 100; }
    .cd-label { font-size: 24px; color: #D4AF37; transition: color 0.5s; } 
    #cd-time { font-size: 48px; }

    #now-playing-widget {
      position: absolute; opacity: 0; pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0,0,0,0.85); border: 4px solid #D4AF37; border-radius: 10px;
      display: flex; align-items: center; padding: 15px 25px; gap: 20px; z-index: 150;
      transform: translateY(-50px) scale(0.9);
    }
    #now-playing-widget.active { opacity: 1; transform: translateY(0) scale(1); }
    .np-art { width: 80px; height: 80px; border-radius: 5px; object-fit: cover; border: 2px solid #55FF55; background: #000; }
    .np-info { display: flex; flex-direction: column; white-space: nowrap; }
    .np-title { font-size: 36px; font-weight: bold; color: #55FF55; margin-bottom: -5px; }
    .np-artist { font-size: 24px; color: #D4AF37; }

    #ticker-wrap { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background-color: rgba(0, 0, 0, 0.85); border-top: 4px solid #D4AF37; border-bottom: 4px solid #D4AF37; display: flex; align-items: center; font-size: 28px; text-transform: uppercase; text-shadow: 2px 2px #000; overflow: hidden; white-space: nowrap; z-index: 1000; }
    .ticker-track { display: flex; animation: seamless-ticker var(--ticker-speed) linear infinite; }
    @keyframes seamless-ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .ticker-item { display: flex; align-items: center; padding-right: 50px; }
    
    #progress-bar-bg { position: absolute; bottom: 54px; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.5); z-index: 1001; display: none; }
    #progress-bar-fill { width: 0%; height: 100%; background: #55FF55; box-shadow: 0 0 10px #55FF55; transition: width 2s ease-in-out; }

    #alert-wrapper { position: absolute; z-index: 9999; display: flex; justify-content: center; width: 100%; top: 15%; pointer-events: none; }
    #alert-box { 
        display: none; 
        background: linear-gradient(135deg, rgba(20,20,20,0.95), rgba(60,0,0,0.95)); 
        border: 4px solid #D4AF37; 
        border-radius: 12px; 
        padding: 25px 60px; 
        text-align: center; 
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.5); 
        animation: epic-popup 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        white-space: nowrap; 
    }
    @keyframes epic-popup { 0% { transform: scale(0.1) translateY(100px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    .alert-title { font-size: 52px; color: #FF5555; text-shadow: 3px 3px 0 #000, 0 0 20px #FF5555; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 6px; }
    .alert-body { font-size: 42px; color: #FFF; text-shadow: 2px 2px 5px #000; }
    
    #confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; overflow: hidden; }
    .confetti-piece { position: absolute; font-size: 30px; animation: fall 3s linear forwards; }
    @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(1100px) rotate(720deg); opacity: 0; } }
    
    .gold-text { color: #D4AF37; } .green-text { color: #55FF55; }
  </style>
</head>
<body>
  
  <!-- BUG SQUASHED: Instantly loads a tiny 1-pixel data URI to permanently kill Evmux's infinite loading spinner -->
  <iframe id="emote-wall" class="widget" src="data:text/html;charset=utf-8,%3Chtml%3E%3Cbody%3E%3C%2Fbody%3E%3C%2Fhtml%3E" allowtransparency="true" style="display:none; z-index: 50;"></iframe>
  <iframe id="band-effects" class="widget" src="data:text/html;charset=utf-8,%3Chtml%3E%3Cbody%3E%3C%2Fbody%3E%3C%2Fhtml%3E" allowtransparency="true" style="display:none; z-index: 55;"></iframe>
  <iframe id="dice-of-doom" class="widget" src="data:text/html;charset=utf-8,%3Chtml%3E%3Cbody%3E%3C%2Fbody%3E%3C%2Fhtml%3E" allowtransparency="true" style="display:none; z-index: 60;"></iframe>

  <div id="countdown-widget" class="widget">
    <div class="cd-label">EXTRA LIFE MARATHON</div>
    <span id="cd-time">00:00:00</span>
  </div>
  
  <div id="now-playing-widget">
    <!-- BUG SQUASHED: Nullify onerror so missing images don't create an infinite memory loop -->
    <img id="np-art" class="np-art" src="stream-player/images/image_ef100c.png" alt="Album Art" onerror="this.onerror=null; this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';">
    <div class="np-info">
      <span class="np-title" id="np-title">Track Name</span>
      <span class="np-artist" id="np-artist">Artist Name</span>
    </div>
  </div>

  <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  
  <div id="alert-wrapper">
    <div id="alert-box">
      <div class="alert-title">⚔️ CRITICAL HIT! ⚔️</div>
      <div class="alert-body" id="alert-text"></div>
    </div>
  </div>

  <div id="ticker-wrap">
    <div class="ticker-track" id="main-ticker-track">
      <div class="ticker-item"><span id="ticker-text-1">Loading Guild Data...</span></div>
      <div class="ticker-item"><span id="ticker-text-2">Loading Guild Data...</span></div>
    </div>
  </div>

  <div id="confetti-container"></div>

  <script>
    const teamID = "74089"; 
    let targetDate = new Date().getTime() + (24 * 60 * 60 * 1000); 
    
    let stagedTicker = { pending: false, active: false, text: "", loops: 0, pendingText: "", pendingLoops: 0 };
    let customTickerText = "";
    let soundsEnabled = true, visualEffectsEnabled = true;
    let npTimeout;

    function applyPosition(el, pos, width, height) {
      if (!pos) pos = 'top-left'; 
      el.style.top = ''; el.style.bottom = ''; el.style.left = ''; el.style.right = ''; el.style.transform = '';
      if(width) el.style.width = width + 'px'; 
      if(height) el.style.height = height + 'px';
      
      let originY = pos.includes('top') ? 'top' : (pos.includes('bottom') ? 'bottom' : 'center');
      let originX = pos.includes('left') ? 'left' : (pos.includes('right') ? 'right' : 'center');
      el.style.transformOrigin = `${originY} ${originX}`;

      switch(pos) {
        case 'top-left': el.style.top = '50px'; el.style.left = '50px'; break;
        case 'top-right': el.style.top = '50px'; el.style.right = '50px'; break;
        case 'top-center': el.style.top = '50px'; el.style.left = '50%'; el.style.transform = 'translateX(-50%)'; break;
        case 'bottom-left': el.style.bottom = '80px'; el.style.left = '50px'; break; 
        case 'bottom-right': el.style.bottom = '80px'; el.style.right = '50px'; break;
        case 'bottom-center': el.style.bottom = '80px'; el.style.left = '50%'; el.style.transform = 'translateX(-50%)'; break;
        case 'center': el.style.top = '50%'; el.style.left = '50%'; el.style.transform = 'translate(-50%, -50%)'; break;
        case 'center-left': el.style.top = '50%'; el.style.left = '50px'; el.style.transform = 'translateY(-50%)'; break;
        case 'center-right': el.style.top = '50%'; el.style.right = '50px'; el.style.transform = 'translateY(-50%)'; break;
      }
    }

    function applyConfig(config) {
      if (!config) return;
      const clock = document.getElementById('countdown-widget'); 
      clock.style.display = config.clock.show ? 'block' : 'none'; 
      applyPosition(clock, config.clock.pos); 
      clock.style.transform += ` scale(${config.clock.scale})`; 
      
      const updateIframe = (id, data) => { 
          if(!data) return;
          const el = document.getElementById(id); 
          el.style.display = data.show ? 'block' : 'none'; 
          applyPosition(el, data.pos, data.width, data.height); 
          
          const emptySrc = "data:text/html;charset=utf-8,%3Chtml%3E%3Cbody%3E%3C%2Fbody%3E%3C%2Fhtml%3E";
          if (data.url && data.url.trim() !== "") {
              if (el.getAttribute('src') !== data.url) el.setAttribute('src', data.url);
          } else {
              if (el.getAttribute('src') !== emptySrc) el.setAttribute('src', emptySrc);
          }
      };
      
      updateIframe('emote-wall', config.emoteWall); 
      updateIframe('band-effects', config.bandEffects); 
      updateIframe('dice-of-doom', config.diceOfDoom);

      document.getElementById('ticker-wrap').style.display = config.ticker.show ? 'flex' : 'none'; 
      document.getElementById('progress-bar-bg').style.display = config.ticker.showProgressBar ? 'block' : 'none';
      customTickerText = config.ticker.customText || "";
      
      applyPosition(document.getElementById('alert-wrapper'), config.alerts.pos);
      soundsEnabled = config.effects.sound; 
      visualEffectsEnabled = config.effects.visual; 
      if (config.targetTime) targetDate = parseInt(config.targetTime);
      
      fetchExtraLifeData(); 
    }

    const topicName = `extralife2026/${teamID}/commands`;
    
    // Explicit, unique Client ID guarantees it doesn't conflict with dashboard or Evmux preview windows
    const mqttOptions = {
        clientId: 'overlay_' + Math.random().toString(16).substring(2, 10),
        keepalive: 60,
        reconnectPeriod: 1000,
        clean: true
    };
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', mqttOptions); 
    
    // BUG SQUASHED: Multi-User Deduplication Tracker
    let processedAlerts = []; 
    let seenDonationIDs = [], donationQueue = [], isAlerting = false, isFirstLoad = true;
    
    client.on('connect', () => { 
        client.subscribe(topicName); 
        client.publish(topicName, JSON.stringify({ type: 'request_sync' })); 
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.type === 'config') applyConfig(data.payload);
        
        // BUG SQUASHED: Deduplicates alerts perfectly if 5 dashboards broadcast simultaneously
        if (data.type === 'alert' && data.payload) {
          const alertId = data.payload.id || data.payload.timestamp;
          if (!processedAlerts.includes(alertId)) {
             processedAlerts.push(alertId);
             donationQueue.push(data.payload);
          }
        }

        if (data.type === 'confetti') fireConfetti();
        if (data.type === 'stage_ticker') {
           stagedTicker.pendingText = data.payload.text; 
           stagedTicker.pendingLoops = data.payload.loops; 
           stagedTicker.pending = true;
        }
        if (data.type === 'now_playing') {
           const np = document.getElementById('now-playing-widget');
           document.getElementById('np-title').innerText = data.payload.title || "Unknown Track";
           document.getElementById('np-artist').innerText = data.payload.artist || "Unknown Artist";
           
           let displayArt = data.payload.art || "stream-player/images/image_ef100c.png";
           if (!displayArt.startsWith("http") && !displayArt.startsWith("stream-player/")) {
               displayArt = "stream-player/" + displayArt;
           }
           document.getElementById('np-art').src = displayArt;
           
           applyPosition(np, data.payload.pos);
           np.classList.add('active');
           
           clearTimeout(npTimeout);
           npTimeout = setTimeout(() => { np.classList.remove('active'); }, 12000);
        }
        if (data.type === 'dice_roll' || data.type === 'dice_reset') {
          const diceFrame = document.getElementById('dice-of-doom');
          const command = data.type === 'dice_roll' ? 'ROLL_DICE' : 'RESET_DICE';
          if(diceFrame && diceFrame.contentWindow) diceFrame.contentWindow.postMessage(command, '*');
        }
      } catch(e) {}
    });

    document.getElementById('main-ticker-track').addEventListener('animationiteration', () => {
        if (stagedTicker.pending) {
            stagedTicker.active = true; 
            stagedTicker.text = stagedTicker.pendingText; 
            stagedTicker.loops = stagedTicker.pendingLoops; 
            stagedTicker.pending = false;
        }
        if (stagedTicker.active) {
            stagedTicker.loops--; 
            if (stagedTicker.loops < 0) { stagedTicker.active = false; stagedTicker.text = ""; }
        }
    });

    let globalAudioCtx = null;
    function playCriticalHitSound() {
      if (!soundsEnabled) return;
      try { 
        if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = globalAudioCtx.createOscillator(); const g = globalAudioCtx.createGain();
        osc.type = 'triangle'; osc.connect(g); g.connect(globalAudioCtx.destination);
        const now = globalAudioCtx.currentTime;
        osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.5);
        g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.00001, now + 1);
        osc.start(now); osc.stop(now + 1); 
      } catch(e) {} 
    }

    function fireConfetti() {
      const container = document.getElementById('confetti-container'); 
      const emojis = ['🎉', '💸', '✨', '🪙', '🎮', '⚔️'];
      for (let i = 0; i < 60; i++) { 
        let el = document.createElement('div'); 
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)]; 
        el.className = 'confetti-piece'; 
        el.style.left = Math.random() * 100 + 'vw'; 
        el.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
        el.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
        container.appendChild(el); 
        setTimeout(() => el.remove(), 5000); 
      }
      playCriticalHitSound();
    }

    setInterval(() => {
      let now = new Date().getTime(), distance = targetDate - now, isOvertime = distance < 0, absDist = Math.abs(distance);
      let d = Math.floor(absDist / (1000 * 60 * 60 * 24));
      let h = Math.floor((absDist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      let m = Math.floor((absDist % (1000 * 60 * 60)) / (1000 * 60));
      let s = Math.floor((absDist % (1000 * 60)) / 1000);
      let tStr = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      if (d > 0) tStr = d + ":" + tStr; 
      
      document.getElementById("cd-time").innerHTML = isOvertime ? "+" + tStr : tStr;
      const cdLabel = document.querySelector('.cd-label'); 
      cdLabel.innerText = isOvertime ? "MARATHON OVERTIME" : "EXTRA LIFE MARATHON"; 
      cdLabel.style.color = isOvertime ? "#FF5555" : "#D4AF37";
    }, 1000);

    function playMagicCoinSound() { 
      if(!soundsEnabled) return; 
      try { 
          const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),g=ctx.createGain();
          osc.type='square';osc.connect(g);g.connect(ctx.destination);
          osc.frequency.setValueAtTime(987.77,ctx.currentTime);
          osc.frequency.setValueAtTime(1318.51,ctx.currentTime+0.1);
          g.gain.setValueAtTime(0.1,ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.4);
          osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.5); 
      } catch(e){} 
    }
    
    async function fetchExtraLifeData() { 
      try { 
        const cacheBuster = Date.now();
        let apiURL = `https://extralife.donordrive.com/api/teams/${teamID}`;
        
        let tRes = await fetch(`${apiURL}?_t=${cacheBuster}`, { cache: 'no-store' });
        if(!tRes.ok) {
          apiURL = `https://extralife.donordrive.com/api/participants/${teamID}`;
          tRes = await fetch(`${apiURL}?_t=${cacheBuster}`, { cache: 'no-store' });
        }
        if(!tRes.ok) return;

        const tData = await tRes.json(); 
        
        // BUG SQUASHED: STRICT 15-DONATION LIMIT IMPOSED TO PREVENT RATE LIMITING
        const dRes = await fetch(`${apiURL}/donations?limit=15&_t=${cacheBuster}`, { cache: 'no-store' }); 
        if(!dRes.ok) return; 

        const dData = await dRes.json();
        const dons = Array.isArray(dData) ? dData : [];

        let raised = tData.sumDonations || 0; 
        let goal = tData.fundraisingGoal || 1; 
        document.getElementById('progress-bar-fill').style.width = Math.min((raised / goal) * 100, 100) + '%'; 
        
        let str = ""; 
        if (stagedTicker.active && stagedTicker.text.trim() !== "") { 
            str += `📢 <span class="green-text">${stagedTicker.text.toUpperCase()}</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; `; 
        } else if (customTickerText.trim() !== "") { 
            str += `📢 <span class="green-text">${customTickerText.toUpperCase()}</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; `; 
        }

        str += `👑 <span class="gold-text">${(tData.name||"Our Guild").toUpperCase()} PROGRESS:</span> $${raised} / $${goal} 👑 &nbsp;&nbsp;&nbsp;&nbsp; 📜 <span class="gold-text">LATEST BENEFACTORS:</span> `; 
        dons.slice(0,5).forEach(d => str += `${d.displayName||"Hero"} ($${d.amount}) • `); 
        
        document.getElementById('ticker-text-1').innerHTML = str; 
        document.getElementById('ticker-text-2').innerHTML = str; 
        
        for(let i=dons.length-1; i>=0; i--){ 
          if(!seenDonationIDs.includes(dons[i].donationID)){ 
            seenDonationIDs.push(dons[i].donationID); 
            if(!isFirstLoad) {
              const newAlert = { id: dons[i].donationID, name: dons[i].displayName || "Hero", amount: dons[i].amount, timestamp: Date.now() };
              
              if(client.connected) {
                // Instantly broadcasts the new alert to ALL overlays globally so they fire at the same time
                client.publish(topicName, JSON.stringify({ type: 'alert', payload: newAlert }));
              }
            } 
          } 
        } 
        isFirstLoad = false; 
      } catch(err){} 
    }
    
    function processQueue() { 
      if(isAlerting || donationQueue.length === 0) return; 
      isAlerting = true; 
      let cur = donationQueue.shift(); 
      document.getElementById('alert-text').innerHTML = `<span style="color:#FFF;">${cur.name}</span> gifted <span class="green-text">$${cur.amount}</span>!`; 
      playMagicCoinSound(); 
      document.getElementById('alert-box').style.display = 'block'; 
      setTimeout(() => {
          document.getElementById('alert-box').style.display = 'none'; 
          setTimeout(() => isAlerting = false, 2000);
      }, 8000); 
    }
    
    // BUG SQUASHED: RESTORED 15-SECOND POLLING INTERVAL
    setInterval(fetchExtraLifeData, 15000); 
    fetchExtraLifeData(); 
    setInterval(processQueue, 1000);
  </script>
</body>
</html>
