<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      width: 1920px;
      height: 1080px;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #dice-container {
      width: 200px;
      height: 200px;
      position: absolute;
      transform-style: preserve-3d;
      /* Starts off-screen to the right */
      transform: translate3d(150vw, -50vh, -1000px) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      transition: transform 2.5s cubic-bezier(0.15, 0.75, 0.25, 1);
      display: none;
      z-index: 10;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(20, 20, 20, 0.95);
      border: 4px solid #FF5555;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(255, 85, 85, 0.5), 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .dot {
      width: 40px;
      height: 40px;
      background: #FF5555;
      border-radius: 50%;
      box-shadow: 0 0 15px #FF5555;
      position: absolute;
    }

    /* Face Positioning */
    #front  { transform: translateZ(100px); }
    #back   { transform: rotateY(180deg) translateZ(100px); }
    #right  { transform: rotateY(90deg) translateZ(100px); }
    #left   { transform: rotateY(-90deg) translateZ(100px); }
    #top    { transform: rotateX(90deg) translateZ(100px); }
    #bottom { transform: rotateX(-90deg) translateZ(100px); }

    /* Dot Layouts */
    #front .dot1 { top: 80px; left: 80px; }
    
    #back .dot1 { top: 40px; left: 40px; }
    #back .dot2 { top: 120px; left: 120px; }
    
    #right .dot1 { top: 40px; left: 40px; }
    #right .dot2 { top: 80px; left: 80px; }
    #right .dot3 { top: 120px; left: 120px; }
    
    #left .dot1 { top: 40px; left: 40px; }
    #left .dot2 { top: 40px; left: 120px; }
    #left .dot3 { top: 120px; left: 40px; }
    #left .dot4 { top: 120px; left: 120px; }
    
    #top .dot1 { top: 40px; left: 40px; }
    #top .dot2 { top: 40px; left: 120px; }
    #top .dot3 { top: 80px; left: 80px; }
    #top .dot4 { top: 120px; left: 40px; }
    #top .dot5 { top: 120px; left: 120px; }
    
    #bottom .dot1 { top: 30px; left: 40px; }
    #bottom .dot2 { top: 30px; left: 120px; }
    #bottom .dot3 { top: 80px; left: 40px; }
    #bottom .dot4 { top: 80px; left: 120px; }
    #bottom .dot5 { top: 130px; left: 40px; }
    #bottom .dot6 { top: 130px; left: 120px; }

    /* Tempt Fate Popup Box */
    #tempt-popup {
      position: absolute;
      bottom: 200px;
      background: rgba(0, 0, 0, 0.85);
      border: 4px solid #D4AF37;
      padding: 25px 50px;
      border-radius: 10px;
      text-align: center;
      color: white;
      box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.4);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.5s ease-out;
    }

    #tempt-popup.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #tempt-popup h2 {
      margin: 0 0 15px 0;
      color: #D4AF37;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #tempt-btn {
      background: #FF5555;
      color: white;
      border: 2px solid #CC0000;
      padding: 15px 30px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    #tempt-btn:hover {
      background: #CC0000;
      transform: scale(1.05);
      box-shadow: 0px 0px 15px rgba(255, 85, 85, 0.6);
    }

  </style>
</head>
<body>

  <div id="dice-container">
    <div class="face" id="front"><div class="dot dot1"></div></div>
    <div class="face" id="back"><div class="dot dot1"></div><div class="dot dot2"></div></div>
    <div class="face" id="right"><div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div></div>
    <div class="face" id="left"><div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div><div class="dot dot4"></div></div>
    <div class="face" id="top"><div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div><div class="dot dot4"></div><div class="dot dot5"></div></div>
    <div class="face" id="bottom"><div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div><div class="dot dot4"></div><div class="dot dot5"></div><div class="dot dot6"></div></div>
  </div>

  <div id="tempt-popup">
    <h2>The Die is Cast</h2>
    <button id="tempt-btn">🎲 Tempt Fate 🎲</button>
  </div>

  <script>
    const dice = document.getElementById('dice-container');
    const popup = document.getElementById('tempt-popup');
    const temptBtn = document.getElementById('tempt-btn');
    let isRolling = false;

    const faceRotations = [
      { x: 0, y: 0 },       // 1 (Front)
      { x: 0, y: -180 },    // 2 (Back)
      { x: 0, y: -90 },     // 3 (Right)
      { x: 0, y: 90 },      // 4 (Left)
      { x: -90, y: 0 },     // 5 (Top)
      { x: 90, y: 0 }       // 6 (Bottom)
    ];

    // Remote Control Listener (For the Dashboard/Evmux)
    window.addEventListener('message', (event) => {
      if (event.data === 'ROLL_DICE' && !isRolling) {
        rollDice();
      }
    });

    // Direct Button Click Listener (For the Popup)
    temptBtn.addEventListener('click', () => {
      if (!isRolling) {
        rollDice();
      }
    });

    function rollDice() {
      isRolling = true;
      dice.style.display = 'block';
      
      // Instantly hide the Tempt Fate popup
      popup.classList.remove('show');
      
      dice.style.transition = 'none';
      dice.style.transform = `translate3d(150vw, -50vh, -1000px) rotateX(0deg) rotateY(0deg) rotateZ(0deg)`;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          
          dice.style.transition = 'transform 2.5s cubic-bezier(0.15, 0.75, 0.25, 1)';
          
          const resultIndex = Math.floor(Math.random() * 6);
          const target = faceRotations[resultIndex];
          
          const spinX = target.x + (360 * (Math.floor(Math.random() * 4) + 3)); 
          const spinY = target.y + (360 * (Math.floor(Math.random() * 4) + 3));
          const spinZ = 360 * (Math.floor(Math.random() * 2) + 1);

          const landX = (Math.random() * 40) - 20; 
          const landY = (Math.random() * 40) - 20;

          dice.style.transform = `translate3d(${landX}px, ${landY}px, 0px) rotateX(${spinX}deg) rotateY(${spinY}deg) rotateZ(${spinZ}deg)`;

          // Wait for the physical roll animation to finish, then reveal the popup
          setTimeout(() => {
            isRolling = false;
            popup.classList.add('show');
          }, 2600);

        });
      });
    }
  </script>
</body>
</html>
