<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: pointer; /* Makes the whole screen obviously clickable */
    }

    #doom-container {
      background: rgba(0, 0, 0, 0.85);
      border: 4px solid #D4AF37;
      border-radius: 15px;
      padding: 40px 60px;
      text-align: center;
      color: white;
      box-shadow: 0px 0px 30px rgba(212, 175, 55, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 320px;
      min-height: 300px;
      transition: transform 0.2s ease-in-out;
    }

    #doom-container:hover {
      transform: scale(1.02);
      box-shadow: 0px 0px 40px rgba(212, 175, 55, 0.6);
    }

    .prompt-text {
      color: #D4AF37;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: bold;
      margin-top: 25px;
    }

    /* Clean SVG Skull - No Emojis */
    .skull-icon {
      width: 120px;
      height: 120px;
      fill: #FFF;
      transition: fill 0.3s;
    }

    #doom-container:hover .skull-icon {
      fill: #FF5555;
    }

    /* D20 Polygon Shape */
    #d20-graphic {
      width: 140px;
      height: 140px;
      position: relative;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .hexagon {
      width: 100%;
      height: 100%;
      background: #FF5555;
      /* Creates the hexagonal silhouette of a 3D D20 */
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      position: absolute;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    .d20-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: 
        linear-gradient(to bottom right, transparent 48%, rgba(0,0,0,0.4) 49%, rgba(0,0,0,0.4) 51%, transparent 52%),
        linear-gradient(to top right, transparent 48%, rgba(0,0,0,0.4) 49%, rgba(0,0,0,0.4) 51%, transparent 52%),
        linear-gradient(to bottom, transparent 48%, rgba(0,0,0,0.4) 49%, rgba(0,0,0,0.4) 51%, transparent 52%);
    }

    #roll-number {
      position: absolute;
      font-size: 58px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
      z-index: 2;
    }

    /* Rolling Animation */
    .rolling {
      animation: spin-tumble 0.4s linear infinite;
    }

    @keyframes spin-tumble {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }
  </style>
</head>
<body>

  <div id="doom-container">
    
    <!-- State 1: The Skull -->
    <div id="state-start">
      <svg class="skull-icon" viewBox="0 0 512 512">
        <path d="M256 0C132.3 0 32 100.3 32 224c0 74.3 36.5 140 92.5 181.3l-10.2 61.4c-2.3 13.9 8.3 25.3 22.4 25.3h238.6c14.1 0 24.7-11.4 22.4-25.3l-10.2-61.4C443.5 364 480 298.3 480 224 480 100.3 379.7 0 256 0zm-80 304c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48zm160 0c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48z"/>
      </svg>
      <div class="prompt-text" id="main-prompt">Tempt Fate?</div>
    </div>

    <!-- State 2: The D20 Roll -->
    <div id="d20-graphic">
      <div class="hexagon"></div>
      <div class="d20-lines"></div>
      <div id="roll-number">20</div>
    </div>

  </div>

  <script>
    let isRolling = false;
    let rollInterval;
    
    const stateStart = document.getElementById('state-start');
    const d20Graphic = document.getElementById('d20-graphic');
    const rollNumber = document.getElementById('roll-number');
    const mainPrompt = document.getElementById('main-prompt');

    // 1. Listen for remote Evmux / Dashboard commands
    window.addEventListener('message', (event) => {
      if (event.data === 'ROLL_DICE' && !isRolling) {
        startRoll();
      }
    });

    // 2. Direct Webpage Interaction
    document.body.addEventListener('click', () => {
      if (!isRolling) {
        startRoll();
      }
    });

    function startRoll() {
      isRolling = true;
      
      // Hide the skull, show the D20
      stateStart.style.display = 'none';
      d20Graphic.style.display = 'flex';
      
      // Remove the prompt text while it spins
      mainPrompt.innerText = "";
      stateStart.style.display = 'block'; // Keep container sized
      document.querySelector('.skull-icon').style.display = 'none';
      
      // Add CSS spin animation
      d20Graphic.classList.add('rolling');

      // Rapidly cycle numbers to simulate a roll
      rollInterval = setInterval(() => {
        rollNumber.innerText = Math.floor(Math.random() * 20) + 1;
      }, 50);

      // Stop the roll after 2 seconds
      setTimeout(() => {
        clearInterval(rollInterval);
        d20Graphic.classList.remove('rolling');
        
        // Final D20 result (1-20)
        const finalResult = Math.floor(Math.random() * 20) + 1;
        rollNumber.innerText = finalResult;

        // Restore the "Tempt Fate Again" text
        mainPrompt.innerText = "Tempt Fate Again";
        
        isRolling = false;
      }, 2000);
    }
  </script>
</body>
</html>
